<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Known Good Lab Surface</title>
  <style>
    :root {
      --bg:#09090b; --surface:#18181b; --text:#e4e4e7;
      --ok:#34d399; --warn:#fbbf24; --bad:#f87171;
      --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
    @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>Runtime Supervision</h1>
    <span class="status-pill" data-epistemic="observed" data-state="healthy">Healthy · Observed</span>
  </header>
  <main class="grid">
    <section>
      <h2>Fleet Status</h2>
      <table>
        <thead><tr><th>Agent</th><th>State</th><th>Quota</th></tr></thead>
        <tbody>
          <tr><td>argon</td><td data-status="active">Active</td><td>34.0%</td></tr>
          <tr><td>opus</td><td data-status="stale">Stale · 6h ago</td><td>Unmeasured (passive)</td></tr>
        </tbody>
      </table>
    </section>
    <section>
      <h2>Topology</h2>
      <svg viewBox="0 0 240 80" role="img" aria-label="Pipe topology">
        <rect x="10" y="20" width="80" height="40" rx="6" fill="#18181b" stroke="#34d399"></rect>
        <circle cx="180" cy="40" r="18" fill="#18181b" stroke="#38bdf8"></circle>
      </svg>
    </section>
  </main>
</body>
</html>
