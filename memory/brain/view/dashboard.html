<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>brain · governance</title>
<link rel="stylesheet" href="tokens.css">
<style>
html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.45 system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.mono{font-family:var(--font-mono)}
a{color:var(--text-dim);text-decoration:none;cursor:pointer}
a:hover{color:var(--text)}

/* header */
header{display:flex;align-items:center;gap:16px;height:56px;padding:0 18px;border-bottom:1px solid var(--border)}
.brand{font-weight:600;letter-spacing:.02em;white-space:nowrap}
.brand .sep{color:var(--text-ghost);font-weight:400;margin:0 4px}
.brand .sub{color:var(--text-faint);font-weight:500}
nav.views{display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:2px}
nav.views .v{padding:3px 11px;border-radius:4px;color:var(--text-faint);font-size:12px}
nav.views .v.on{background:#27272a;color:var(--text)}
.hspace{flex:1}
.stepper{display:flex;gap:3px;align-items:center}
.tick{appearance:none;width:15px;height:15px;border:1px solid var(--border);border-radius:3px;display:grid;place-items:center;
  font-size:9px;color:var(--text-ghost);font-family:var(--font-mono);background:var(--surface-2);padding:0;cursor:pointer}
.tick.fill{background:#1b2a24;border-color:#1f3d33}
.tick.on{background:var(--ok-bg);border-color:var(--accent);color:var(--ok)}
.asof{font-family:var(--font-mono);color:var(--text-faint);font-size:12px}
.xnav{font-size:12px;white-space:nowrap}

main{padding:0 18px 28px}
section{margin-top:12px}
.band{border:1px solid var(--border);background:var(--surface-2);border-radius:6px;overflow:hidden}
.sec{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-faint);margin:0 2px 6px}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.d-half{background:conic-gradient(var(--warn) 0 50%,var(--border-2) 50% 100%)}

/* status strip */
#status{display:flex;height:46px;align-items:stretch}
.seg{flex:1;display:flex;align-items:center;gap:9px;padding:0 16px;border-left:1px solid var(--border);min-width:0;cursor:pointer}
.seg:first-child{border-left:none}
.seg:hover{background:var(--surface-2)}
.seg .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);white-space:nowrap}
.seg .v{font-family:var(--font-mono);font-size:14px;color:var(--text)}
.seg .v.warn{color:var(--warn)} .seg .v.ok{color:var(--ok)} .seg .v.bad{color:var(--bad)}
.seg .v.dim{font-size:12px;color:var(--text-dim)}
.ticksv{display:flex;gap:2px;align-items:flex-end;height:12px}
.ticksv i{width:3px;border-radius:1px;display:block}

/* operations truth: each value is compact, but its status/provenance remains
   inspectable. This is observational only — it contains no control affordance. */
#operations{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0}
.op{min-width:0;padding:9px 12px;border-left:1px solid var(--border)}
.op:first-child{border-left:none}.op:nth-child(n+5){border-top:1px solid var(--border)}
.op .k{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-faint)}
.op .v{font-family:var(--font-mono);font-size:12px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.op .v.warn{color:var(--warn)} .op .v.bad{color:var(--bad)} .op .v.ok{color:var(--ok)}
.opnote{grid-column:1/-1;padding:7px 12px;border-top:1px solid var(--border);font:11px/1.35 var(--font-mono);color:var(--text-ghost)}

/* shared attention: framework routing, external acknowledgement history, backlog */
#inbox{min-height:188px}
.attention-group{padding:12px 0}.attention-group+.attention-group{border-top:1px solid var(--border)}
.attention-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;padding:0 14px 7px}.attention-head .k{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-faint)}
.attention-head .desc{font-size:11px;color:var(--text-ghost);min-width:0}.attention-head .cnt{margin-left:auto}
.attention-empty{padding:4px 14px;color:var(--text-ghost);font:11px var(--font-mono)}
.attention-candidate{margin:0 14px;border:1px solid rgba(251,191,36,.28);background:rgba(69,53,10,.1);border-radius:5px;padding:8px 10px}
.attention-candidate+.attention-candidate{margin-top:6px}.candidate-meta{font:11px/1.45 var(--font-mono);color:var(--text-faint);margin-top:5px;overflow-wrap:anywhere}
.candidate-meta strong{color:var(--warn);font-weight:500}
.irows{display:flex;flex-direction:column;justify-content:center;padding:6px 0;min-width:0}
.irow{display:flex;align-items:center;gap:10px;padding:0 16px;height:44px;min-width:0;cursor:pointer}
.irow:hover{background:var(--surface-2)}
.irow + .irow{border-top:1px solid var(--border)}
.kind{font-family:var(--font-mono);font-size:10px;color:var(--text-ghost);width:118px;flex:none;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cnt{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);background:var(--surface);border:1px solid var(--border);
  border-radius:999px;padding:0 7px;line-height:15px;flex:none}
.ititle{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-dim)}
.age{font-family:var(--font-mono);font-size:11px;color:var(--text-ghost);flex:none}
.cardcol{border-left:1px solid var(--border);padding:12px;display:flex}
.dcard{flex:1;display:flex;flex-direction:column;gap:9px;border:1px solid rgba(248,113,113,.32);
  background:rgba(69,10,10,.16);border-radius:6px;padding:12px 14px;min-width:0;cursor:pointer}
.dcard .top{display:flex;align-items:center;gap:10px}
.dcard .ttl{font-size:13px;color:var(--text)}
.empty{display:flex;align-items:center;justify-content:center;color:var(--text-ghost);grid-column:1/-1;min-height:188px}
.rvw{font-family:var(--font-mono);font-size:11px;color:var(--accent);border:1px solid var(--accent);
  border-radius:5px;padding:3px 9px;line-height:1;align-self:flex-start;white-space:nowrap;flex:none}
.rvw:hover{background:var(--accent);color:var(--bg)}

/* embedded cluster map */
#mapband{position:relative}
#map{display:block;width:100%;height:52vh;min-height:430px}
#mapnote{position:absolute;inset:0;display:grid;place-items:center;color:var(--text-ghost);
  font-family:var(--font-mono);font-size:11px;pointer-events:none}
#mapnote[hidden]{display:none}

/* loop strip */
.strip{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ls{display:flex;align-items:center;gap:9px;border:1px solid var(--border);background:var(--surface-2);
  border-radius:6px;padding:7px 13px;cursor:pointer}
.ls:hover{border-color:var(--border-2)}
.ls .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint)}
.ls .v{font-family:var(--font-mono);font-size:12.5px;color:var(--text)}
.ls .v.ok{color:var(--ok)} .ls .v.bad{color:var(--bad)} .ls .v.warn{color:var(--warn)} .ls .v.dim{color:var(--text-dim)}
.arrow{color:var(--text-ghost)}

/* row bands: contracts · timeline · rules */
.row{display:flex;align-items:center;gap:11px;height:34px;padding:0 14px;min-width:0;cursor:pointer}
.row:hover{background:var(--surface-2)}
.row + .row{border-top:1px solid var(--border)}
.rid{font-family:var(--font-mono);font-size:11px;color:var(--text);flex:none;max-width:190px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rid.w{width:128px}
.rtxt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-dim)}
.rmono{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);flex:none}
.aid{display:flex;align-items:center;gap:6px;width:150px;flex:none;font-family:var(--font-mono);font-size:11px;color:var(--text-dim)}
.row.flag{background:var(--warn-bg);background:color-mix(in srgb,var(--warn-bg) 55%,transparent);
  box-shadow:inset 2px 0 0 var(--warn)}
.row.more .rtxt{color:var(--text-faint);font-size:12px}
.nbadge{font-family:var(--font-mono);font-size:10px;color:var(--warn);background:var(--warn-bg);
  border:1px solid rgba(251,191,36,.3);border-radius:999px;padding:0 7px;line-height:15px;flex:none}
.nzero{font-family:var(--font-mono);font-size:10px;color:var(--text-ghost);flex:none}

/* per-day chips */
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chipday{font-family:var(--font-mono);font-size:11px;color:var(--text-dim);border:1px solid var(--border);
  background:var(--surface-2);border-radius:6px;padding:4px 10px;white-space:nowrap;cursor:pointer}
.chipday:hover{border-color:var(--border-2);color:var(--text)}
footer{margin:20px 2px 6px;font-family:var(--font-mono);font-size:11px;color:var(--text-ghost);display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:780px){
  #operations{grid-template-columns:repeat(2,minmax(0,1fr))}
  .op:nth-child(odd){border-left:none}.op:nth-child(n+3){border-top:1px solid var(--border)}
}
@media (max-width:540px){
  header{gap:8px;padding:0 10px}.brand .sub{display:none}main{padding-left:10px;padding-right:10px}
  header .stepper,header .asof,header .xnav{display:none}
  #status{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));height:auto}
  #status .seg{height:44px;padding:0 10px;border-top:1px solid var(--border)}
  #status .seg:nth-child(-n+2){border-top:none}#status .seg:nth-child(odd){border-left:none}
  #operations{grid-template-columns:1fr}.op{border-left:none!important;border-top:1px solid var(--border)}.op:first-child{border-top:none}
  .row{gap:7px;padding:0 10px}.rid.w{width:90px}.aid{width:90px}.rmono{display:none}
}

/* Keep complete contract titles readable inside the existing narrow drawer. */
#ui-panel summary.contract-summary{flex-wrap:wrap;gap:6px 8px}
#ui-panel summary.contract-summary .ui-id{width:auto;flex:1;min-width:0}
#ui-panel summary.contract-summary .ui-note{color:var(--text-dim);flex:1 0 100% !important;order:1;min-width:0;overflow-wrap:anywhere;white-space:normal}
#ui-panel summary.contract-summary .ui-num{color:var(--text-dim);white-space:nowrap}
</style>
</head>
<body>

<header>
  <div class="brand">brain<span class="sep">·</span><span class="sub">governance</span></div>
  <nav class="views" title="view" aria-label="Brain views">
    <a class="v on" href="dashboard.html" aria-current="page">Dashboard</a><a class="v" href="graph.html">Map</a><a class="v" href="activity.html">Activity</a><a class="v" href="proposal_review.html">Review</a>
  </nav>
  <div class="hspace"></div>
  <div class="stepper" id="stepper"></div>
  <div class="asof" id="asof"></div>
  <a class="xnav" id="apparatus" title="open the apparatus dashboard">apparatus →</a>
</header>

<div id="data-source-status" aria-label="Projection data sources">Data sources have not been checked.</div>
<noscript><p role="alert">Dashboard needs JavaScript to check and display data. Enable JavaScript for this site, then reload this page.</p></noscript>
<div id="data-source-announcement" role="status" aria-live="polite" aria-atomic="true" class="ui-visually-hidden"></div>

<main>
  <section class="band" id="status"></section>

  <section id="operationsband">
    <span class="sec" title="bounded local observations; no service controls">operations truth</span>
    <div class="band" id="operations"><div class="opnote" data-state="loading">checking operations data availability…</div></div>
  </section>
  <div id="operations-source-status" class="opnote" aria-label="Operations data source"></div>

  <section class="band" id="inbox">
    <div class="irows" id="irows"></div>
    <div class="cardcol" id="icard"></div>
  </section>

  <section class="band" id="mapband">
    <canvas id="map"></canvas>
    <div id="mapnote" hidden>map data not generated — scripts/project_map.py</div>
  </section>

  <section id="loopband">
    <span class="sec" title="harvest → propose → review → enact: the self-healing loop">loop</span>
    <div class="strip" id="loopstrip"></div>
  </section>

  <section id="contractsband">
    <span class="sec" title="Source-reported task checks; inspect evaluator and source context. No independent execution verification here.">contracts · reported checks</span>
    <div class="band" id="contracts"></div>
  </section>

  <section id="timelineband">
    <span class="sec" title="brain events in the selected window">timeline</span>
    <div class="band" id="timeline"></div>
  </section>

  <section id="rulesband">
    <span class="sec" title="active framework rules distilled from corrections">rules</span>
    <div class="band" id="rules"></div>
  </section>

  <section id="daysband">
    <span class="sec" title="per-day rendered brain views">days</span>
    <div class="chips" id="days"></div>
  </section>

  <footer id="foot"></footer>
</main>

<script defer src="summary_data.js"></script>
<script defer src="map_data.js"></script>
<script defer src="ui.js?v=5dcf781d655c42b38ddfe704a6ca133db13ab339e66fc74ed5413e1f3873d664"></script>
<script defer src="map.js"></script>
<script>
(function () {
"use strict";
// Start only after deferred scripts settle. This watchdog runs while downloads
// are pending; it does not depend on ui.js or create another external loader.
const startupName = "Dashboard";
function bootFailure(message, error) {
  const status = document.getElementById("data-source-status");
  status.textContent = startupName + " could not start. " + message;
  status.setAttribute("role", "alert");
  if (error) console.error(startupName + " startup failed", error);
}
let startupSettled = false, startupTimer = null;
const startupNow = () => window.performance ? window.performance.now() : Date.now();
const startupDeadline = startupNow() + 5000;
function clearStartup() {
  clearTimeout(startupTimer);
  document.removeEventListener("DOMContentLoaded", readyToStart);
  document.removeEventListener("visibilitychange", checkStartupDeadline);
  window.removeEventListener("pagehide", interruptStartup);
}
function failStartup(message) {
  if (startupSettled) return;
  startupSettled = true;
  clearStartup();
  bootFailure(message);
}
function expireStartup() {
  failStartup("Interface files did not finish loading within 5 seconds. Reload this page; if it persists, report the page URL and pending browser request.");
}
function checkStartupDeadline() {
  if (!document.hidden && startupNow() >= startupDeadline) expireStartup();
}
function interruptStartup() {
  failStartup("Page startup was interrupted. Reload this page to load the interface again.");
}
function readyToStart() {
  if (startupSettled) return;
  // Visibility throttling can delay the timer; a late ready event must not win.
  if (startupNow() >= startupDeadline) { expireStartup(); return; }
  startupSettled = true;
  clearStartup();
  try { startPage(); }
  catch (error) {
    bootFailure("An initialization error interrupted loading. Reload this page; if it persists, report the page URL and browser error.", error);
  }
}
if (document.readyState === "complete") readyToStart();
else {
  document.getElementById("data-source-status").textContent = "Loading interface files (up to 5 seconds)…";
  document.addEventListener("DOMContentLoaded", readyToStart);
  document.addEventListener("visibilitychange", checkStartupDeadline);
  window.addEventListener("pagehide", interruptStartup);
  startupTimer = setTimeout(expireStartup, 5000);
}
function startPage() {
// The HTML and shared interface must agree. A versioned URL avoids reusing an
// older cached interface after deployment; a failed download must stay visible.
const U = window.UI;
const required = ["esc", "dataSource", "usableSummary", "usableMap", "pageRefresh",
  "renderDataStatus", "describeDataSource", "sevColor", "sevPill", "fmtAge",
  "fmtDate", "fmtBytes", "fmtTs", "agentHue", "kv", "copyBlock"];
if (!U || !required.every(name => typeof U[name] === "function") ||
    !U.panel || typeof U.panel.open !== "function") {
  bootFailure("The interface files are missing or incompatible. Reload this page to request the current files. If this persists, report the page URL and browser error.");
  return;
}
let D = window.BRAIN_SUMMARY || null;  // static fallback; replaced by live /api/summary
let M = window.BRAIN_MAP || null;      // static fallback; replaced by live /api/map
let O = null;                          // operations has no baked fallback: unknown offline
const $ = id => document.getElementById(id);
const esc = U.esc;

/* ---------- window state (persisted; ←/→ steps) ----------
   Initialized to a safe default here (this runs at parse time, before D is
   guaranteed); refined from D.window inside boot() once a summary is loaded, so a
   missing baked file can never crash the prelude before the fallback message. */
let windowDays = 7;
function initWindowState() {
  windowDays = D.window.default_days || 7;
  try {
    const s = parseInt(localStorage.getItem("brain.windowDays"), 10);
    if (s >= D.window.min_days && s <= D.window.max_days) windowDays = s;
  } catch (_) {}
}

let asof = "";  // set by paint() from the active summary's generated_at
const dayDiff = date => Math.round(
  (Date.parse(asof + "T00:00:00Z") - Date.parse(String(date).slice(0, 10) + "T00:00:00Z")) / 864e5);
const inWin = date => { const dd = dayDiff(date); return dd >= 0 && dd < windowDays; };
const winStart = () => new Date(Date.parse(asof + "T00:00:00Z") - (windowDays - 1) * 864e5)
  .toISOString().slice(0, 10);

// re-slice a matrix cell to the window from its by_day buckets
function sliceCell(c) {
  if (!c.by_day) return { e: c.explicit || 0, i: c.inferred || 0 };
  let e = 0, i = 0;
  for (const d in c.by_day) if (inWin(d)) { e += c.by_day[d].e || 0; i += c.by_day[d].i || 0; }
  return { e, i };
}
const agentRuns = a => {
  let n = 0;
  for (const d in (a.runs_by_day || {})) if (inWin(d)) n += a.runs_by_day[d];
  return n;
};

/* ---------- header ---------- */
function renderStepper() {
  const st = $("stepper");
  st.innerHTML = "";
  st.title = "window: last " + windowDays + " day" + (windowDays === 1 ? "" : "s") +
    " (" + winStart() + " → " + asof + ") · ←/→ to step";
  for (let d = D.window.min_days; d <= D.window.max_days; d++) {
    const t = document.createElement("button");
    t.className = d === windowDays ? "tick on" : d < windowDays ? "tick fill" : "tick";
    if (d === D.window.min_days || d === D.window.max_days) t.textContent = d;
    t.addEventListener("click", () => setWindow(d));
    st.appendChild(t);
  }
}
function setWindow(n) {
  if (!D || n === windowDays || n < D.window.min_days || n > D.window.max_days) return;
  windowDays = n;
  try { localStorage.setItem("brain.windowDays", String(n)); } catch (_) {}
  renderStepper();
  renderTimeline();
  mountMap();
}
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
  if (e.key === "ArrowLeft") setWindow(windowDays - 1);
  if (e.key === "ArrowRight") setWindow(windowDays + 1);
});
$("apparatus").href = "http://" + (location.hostname || "localhost") + ":5173";

/* ---------- status strip (6 segments; click scrolls to band) ---------- */
function renderStatus() {
  const s = D.status_strip, host = $("status");
  host.innerHTML = "";
  const seg = (target, title) => {
    const e = document.createElement("div");
    e.className = "seg";
    e.title = title;
    e.addEventListener("click", () => {
      const t = $(target);
      if (t) t.scrollIntoView({ behavior: "smooth", block: "start" });
    });
    host.appendChild(e);
    return e;
  };
  const SYS = { ok: ["var(--ok)", "ok"], attention: ["var(--warn)", "warn"], critical: ["var(--bad)", "bad"] };
  const sy = SYS[s.system] || SYS.attention;
  let e = seg("inbox", "system: " + s.system);
  e.innerHTML = '<span class="dot" style="background:' + sy[0] + '"></span><span class="v ' + sy[1] + '">' + esc(s.system) + "</span>";

  const n = currentNeedsYou();
  e = seg("inbox", n.high + " high · " + n.med + " med · " + n.low + " low");
  e.innerHTML = '<span class="k">needs you</span><span class="v">' + n.total + '</span>' +
    '<span class="ticksv">' +
    [["high", 10, "var(--bad)"], ["med", 7, "var(--warn)"], ["low", 4, "var(--idle)"]].map(b =>
      '<i style="height:' + b[1] + "px;background:" + b[2] + ";opacity:" + (n[b[0]] ? 1 : .25) + '"></i>').join("") +
    "</span>";

  e = seg("mapband", "skills drifting from contract — worst: " + (s.drift.worst || "—"));
  e.innerHTML = '<span class="k">drift</span><span class="v warn">' + s.drift.skills + "</span>";

  e = seg("loopband", "bubbled drift candidates awaiting promotion");
  e.innerHTML = '<span class="k">candidates</span><span class="v warn">' + s.candidates.total + "</span>";

  const lp = s.loop;
  const ldot = lp.state === "active" ? '<span class="dot" style="background:var(--ok)"></span>'
    : lp.state === "dormant" ? '<span class="dot" style="background:var(--border-2)"></span>'
    : '<span class="dot d-half"></span>';
  e = seg("loopband", "healing loop " + lp.state + " for " + lp.dormant_days + " days");
  e.innerHTML = ldot + '<span class="k">loop</span><span class="v dim">' + esc(lp.state) + " · " + lp.dormant_days + "d</span>";

  const fw = s.firewall, fwOk = fw.status === "intact" && !fw.violations;
  e = seg("mapband", "dev-time / runtime firewall: " + fw.status + " · violations " + (fw.violations || 0));
  e.innerHTML = '<span class="k">fw</span>' +
    (fwOk ? '<span class="v ok">✓</span>' : '<span class="v bad">✗ ' + fw.violations + "</span>");

  const fr = s.freshness;
  const fcls = fr.recall_floor_age_days <= 1 ? "ok" : fr.recall_floor_age_days <= 3 ? "warn" : "bad";
  e = seg("daysband", "recall floor: " + fr.recall_floor + " · newest event " + fr.newest_event);
  e.innerHTML = '<span class="k">fresh</span><span class="v ' + fcls + '">' + fr.recall_floor_age_days + "d</span>";
}

/* ---------- bounded operations truth (read-only; no implied control) ---------- */
function renderOperations(phase = "unavailable") {
  const host = $("operations");
  if (!O || !O.read_only) {
    const online = location.protocol === "http:" || location.protocol === "https:";
    let state, message;
    if (!online) {
      state = "offline";
      message = "operations data unavailable in this offline file view — open the dashboard through the brain server to inspect bounded local observations";
    } else if (phase === "loading") {
      state = "loading";
      message = "loading operations data from api/operations…";
    } else if (operationsSource.error) {
      state = "error";
      message = "operations data unavailable — request failed (" + operationsSource.error + "); api/operations did not return usable data";
    } else {
      state = "unavailable";
      message = "operations data unavailable — no usable response has been received from api/operations";
    }
    host.innerHTML = '<div class="opnote" data-state="' + state + '">' + esc(message) + '</div>';
    return;
  }
  const f = (obj, fallback = "unknown") => obj && obj.value !== undefined && obj.value !== null ? obj.value : fallback;
  const stat = obj => (obj && obj.status) || "unknown";
  const cls = obj => stat(obj) === "observed" ? "ok" : stat(obj) === "stale" || stat(obj) === "partial" ? "warn" : "bad";
  const short = value => {
    if (value === null || value === undefined || value === "") return "unknown";
    if (typeof value === "object") return JSON.stringify(value);
    return String(value);
  };
  const cell = (key, value, detail) => '<div class="op" title="' + esc(detail || "") + '">' +
    '<div class="k">' + esc(key) + ' · ' + esc(stat(value)) + '</div><div class="v ' + cls(value) + '">' +
    esc(short(f(value))) + '</div></div>';
  const lifecycle = O.proposals && O.proposals.counts;
  const c = f(lifecycle, {});
  const cursor = O.cursors && O.cursors.consumer;
  const cursorValue = f(cursor, null);
  const cursorText = cursorValue && typeof cursorValue === "object"
    ? "Δ " + cursorValue.delta_lines + " lines" : "unknown";
  const repoParts = O.repo ? [O.repo.branch, O.repo.head, O.repo.tracked_dirty_count] : [];
  const repoStatus = !O.repo || repoParts.some(x => stat(x) === "unknown") ? "unknown" : "observed";
  host.innerHTML =
    cell("brain server", O.server && O.server.alive, O.server && O.server.alive && O.server.alive.uncertainty) +
    cell("watcher", O.watcher && O.watcher.state, O.watcher && O.watcher.state && O.watcher.state.uncertainty) +
    cell("last pipeline ok", O.pipeline && O.pipeline.last_success, "bounded log tail only") +
    cell("last pipeline fail", O.pipeline && O.pipeline.last_failure, "absence in tail is unknown, not proof of none") +
    cell("projection age", O.projection && O.projection.age_seconds,
         "seconds since static summary.json; live dashboard data is separate") +
    cell("consumer cursor", {value: cursorText, status: stat(cursor), provenance: "cursor"},
         cursor && cursor.uncertainty) +
    cell("reported verification receipts / proposal evidence", {value: "accepted " + (c.accepted ?? "?") + " · enacted " + (c.enacted ?? "?") + " · reported verification receipts " + (c.verified ?? "?"),
                                  status: stat(lifecycle), provenance: "proposal evidence"},
         "Counts are per proposal. Verification receipts are structurally reported; execution and output bytes are not independently verified. " + ((lifecycle && lifecycle.uncertainty) || "")) +
    cell("repo", {value: (f(O.repo && O.repo.branch) || "detached") + " · " + f(O.repo && O.repo.head) +
                          " · tracked dirty " + f(O.repo && O.repo.tracked_dirty_count), status: repoStatus, provenance: "git"},
         "untracked files, paths, and contents are intentionally excluded") +
    '<div class="opnote">' + esc((O.warnings || []).length
      ? "warnings: " + O.warnings.join(" · ")
      : "all displayed fields include a local provenance/status envelope; acceptance alone never counts as enactment") + '</div>';
}

/* ---------- needs-you inbox ---------- */
const RANK = { high: 0, med: 1, low: 2 };
const attentionKeys = ["framework_actions", "external_acknowledgements", "backlog_history"];
const attentionItem = it => it && typeof it === "object" && !Array.isArray(it)
  ? it : { title: "Malformed attention record", detail: String(it), actionable: false };
const sorted = (rows = D.inbox) => (Array.isArray(rows) ? rows : []).map(attentionItem)
  // null-safe age tiebreak: live-reconciled items can carry age_days=null (no
  // timestamp from the API); treat null as oldest so it never yields NaN.
  .sort((a, b) => RANK[a.severity] - RANK[b.severity] ||
    ((a.age_days ?? 1e9) - (b.age_days ?? 1e9)));

// dynamic review: proposal_review items (framework/actionable) get a "Review →"
// link opening the same-origin review UI. Built as a plain relative anchor so it
// works under both http:// and file://; if proposal_review.html is genuinely
// absent (probed best-effort under http), the link self-removes — degrade
// gracefully. P-NNN proposal id lives in it.id.
const isReviewItem = it =>
  reviewUiPresent !== false &&
  it && it.kind === "proposal_review" && it.surface === "framework" &&
  it.actionable === true && /^P-\d+$/.test(it.id || "");
let reviewUiPresent = null; // null=unknown, true/false once probed
const reviewSource = U.dataSource(null, d => d.present === true,
  { method: "HEAD", read: () => ({ present: true }) });
async function probeReviewUi(current) {
  if (reviewUiPresent !== null) return;
  if (location.protocol !== "http:" && location.protocol !== "https:") {
    reviewUiPresent = true; // can't probe file://; assume present, let nav handle it
    return;
  }
  reviewUiPresent = true; // optimistic until the probe answers
  const available = await reviewSource.refresh("proposal_review.html");
  if (current() && !available) hideReviewLinks();
}
function hideReviewLinks() {
  reviewUiPresent = false;
  document.querySelectorAll("[data-review-link]").forEach(a => a.remove());
}
function reviewLink(it, cls) {
  const id = encodeURIComponent(it.id);
  return '<a class="' + cls + '" data-review-link href="proposal_review.html?id=' + id +
    '" title="open the dynamic review for ' + esc(it.id) + '">Review &rarr;</a>';
}

function attentionPartitions() {
  const a = D.attention;
  return a && typeof a === "object" && !Array.isArray(a) &&
    attentionKeys.every(key => Array.isArray(a[key])) ? a : null;
}
function frameworkAction(it, key, attention) {
  return !!attention && key === "framework_actions" && it.surface === "framework" &&
    it.actionable === true && typeof it.id === "string" && !!it.id &&
    typeof it.kind === "string" && !!it.kind && it.kind !== "candidate_review" &&
    !it.candidate && !["external_acknowledgements", "backlog_history"].some(partition =>
      attention[partition].some(other => other && other.id === it.id));
}
function currentNeedsYou() {
  const counts = { high: 0, med: 0, low: 0, total: 0 };
  const attention = attentionPartitions();
  if (!attention) return counts;
  attention.framework_actions.map(attentionItem).forEach(it => {
    if (!frameworkAction(it, "framework_actions", attention)) return;
    counts.total++;
    if (["high", "med", "low"].includes(it.severity)) counts[it.severity]++;
  });
  return counts;
}
function renderInbox() {
  const fallback = sorted();
  const attention = attentionPartitions() || {
    framework_actions: fallback.filter(it => it.surface === "framework" && it.kind !== "candidate_review"),
    external_acknowledgements: fallback.filter(it => it.surface !== "framework" && it.kind !== "candidate_review"),
    external_groups: [],
    backlog_history: fallback.filter(it => it.kind === "candidate_review"),
    totals: { all: fallback.length },
    authority_note: "External items are view-only here.",
  };
  const groups = [
    ["framework_actions", "framework actions", "Derrick/Oracle may route these through framework-governed paths."],
    ["external_acknowledgements", "external a_bgt_rsi acknowledgements/history", "View-only here; authority and acknowledgement remain with a_bgt_rsi."],
    ["backlog_history", "backlog / history", "Candidates remain held for attributable Derrick/Oracle review; automatic graduation is closed."],
  ];
  const host = $("inbox");
  host.innerHTML = "";
  groups.forEach(([key, label, description]) => {
    const list = attention[key].map(attentionItem);
    const section = document.createElement("div");
    section.className = "attention-group";
    section.innerHTML = '<div class="attention-head"><span class="k">' + esc(label) + '</span>' +
      '<span class="desc">' + esc(description) + '</span><span class="cnt">×' + list.length + "</span></div>";
    if (!list.length) {
      section.innerHTML += '<div class="attention-empty">none currently</div>';
    } else if (key === "backlog_history") {
      list.forEach(it => {
        const candidate = it.candidate || {};
        const card = document.createElement("div");
        card.className = "attention-candidate";
        card.title = it.detail || "";
        card.innerHTML = '<div class="top"><span class="dot" style="background:' + U.sevColor(it.severity) + '"></span>' +
          '<span class="kind">candidate</span><span style="flex:1"></span><span class="age">' + U.fmtAge(it.age_days) + "</span></div>" +
          '<div class="ttl">' + esc(it.title) + "</div>" +
          '<div class="candidate-meta">evidence: ' + esc(candidate.evidence_reference || "unknown") +
          " · blast radius: <strong>" + esc(candidate.blast_radius || "unknown") + "</strong>" +
          " · hold: " + esc(candidate.hold_reason || "automatic graduation is closed") +
          " · next route: " + esc(candidate.authorized_next_route || "attributable steward review only") + "</div>";
        card.addEventListener("click", () => openInboxKind(it.kind, key));
        section.appendChild(card);
      });
    } else if (key === "external_acknowledgements") {
      const grouped = (Array.isArray(attention.external_groups) && attention.external_groups.length &&
        attention.external_groups.every(g => g && typeof g === "object"))
        ? attention.external_groups
        : (() => {
          const byKind = new Map();
          list.forEach(it => { if (!byKind.has(it.kind)) byKind.set(it.kind, []); byKind.get(it.kind).push(it); });
          return Array.from(byKind.keys()).sort().map(kind => {
            const representative = byKind.get(kind)[0];
            return {kind: kind, count: byKind.get(kind).length, representative: representative};
          });
        })();
      grouped.forEach(group => {
        const representative = group.representative || {};
        const row = document.createElement("div");
        row.className = "irow";
        row.title = "open all " + group.count + " external " + group.kind + " item(s); view-only here";
        row.innerHTML = '<span class="dot" style="background:var(--text-ghost)"></span>' +
          '<span class="kind">' + esc(group.kind) + '</span><span class="cnt">×' + Number(group.count || 0) + '</span>' +
          '<span class="ititle">' + esc(representative.title || representative.id || "external acknowledgement") + '</span>' +
          '<span class="age">' + U.fmtAge(representative.age_days) + "</span>";
        row.addEventListener("click", () => openInboxKind(group.kind, key));
        section.appendChild(row);
      });
    } else {
      list.forEach(it => {
        const row = document.createElement("div");
        row.className = "irow";
        row.title = it.detail || "";
        row.innerHTML = '<span class="dot" style="background:' + U.sevColor(it.severity) + '"></span>' +
          '<span class="kind">' + esc(it.kind) + '</span><span class="ititle">' + esc(it.title) + '</span>' +
          '<span class="age">' + U.fmtAge(it.age_days) + "</span>";
        row.addEventListener("click", () => openInboxKind(it.kind, key));
        section.appendChild(row);
      });
    }
    host.appendChild(section);
  });
}

function openInboxKind(kind, key) {
  const attention = attentionPartitions();
  const contextual = attention && attentionKeys.includes(key);
  // Raw/legacy detail remains descriptive. A kind alone never conveys the
  // partition's action eligibility, especially when several lanes share it.
  const list = sorted(contextual ? attention[key] : D.inbox).filter(it => it.kind === kind);
  const html = list.map(it => {
    const inc = (D.incidents || []).find(x => x.id === it.id);
    return '<div class="ui-item">' +
      '<div class="ui-row">' + U.sevPill(it.severity) +
      '<span class="ui-id" style="flex:1;width:auto" title="' + esc(it.id) + '">' + esc(it.id) + "</span>" +
      (it.reversible === false ? '<span class="ui-chip warn" title="this action does not undo">irreversible</span>' : "") +
      '<span class="ui-num">' + U.fmtAge(it.age_days) + "</span></div>" +
      '<div class="ui-title">' + esc(it.title) + "</div>" +
      (it.detail ? '<div class="ui-note">' + esc(it.detail) + "</div>" : "") +
      (!frameworkAction(it, key, attention)
        ? '<div class="ui-note" style="opacity:.65">view-only — use the record’s governed route; no action granted here</div>'
        : (isReviewItem(it) ? '<div class="ui-row" style="min-height:24px">' + reviewLink(it, "rvw") + "</div>" : "") +
          (typeof it.action_cmd === "string" && it.action_cmd ? U.copyBlock(it.action_cmd) : "")) +
      '<div class="ui-row" style="min-height:20px"><span class="ui-num">' + esc(it.surface || "") +
      " · " + esc(it.source || "") + "</span><span style='flex:1'></span>" +
      (it.link && it.link.skill ? '<span class="ui-chip" data-skill="' + esc(it.link.skill) + '">' + esc(it.link.skill) + "</span>" : "") +
      "</div>" +
      (inc ? (inc.kv || []).map(p => U.kv(p[0], esc(p[1]))).join("") +
        (inc.body ? '<div class="ui-note">' + esc(inc.body) + "</div>" : "") : "") +
      "</div>";
  }).join("");
  U.panel.open(kind + " × " + list.length, html);
}

/* ---------- side-panel builders ---------- */
const STATE_CHIP = {
  drift: ["warn", "drift"], healed: ["ok", "healed"], new: ["", "new"],
  by_design: ["", "ref-only by design"], untested: ["", "untested"],
  firewall_violation: ["warn", "firewall"], ok: null
};
function usageRows(filterKey, filterVal, hueOf) {
  const rows = (D.matrix.cells || [])
    .filter(c => c[filterKey] === filterVal)
    .map(c => ({ c, w: sliceCell(c) }))
    .filter(x => x.w.e + x.w.i > 0)
    .sort((a, b) => (b.w.e + b.w.i) - (a.w.e + a.w.i));
  if (!rows.length) return '<div class="ui-note">no usage in window</div>';
  const mx = Math.max(...rows.map(x => x.w.e + x.w.i));
  return rows.map(x => {
    const other = filterKey === "skill" ? x.c.agent : x.c.skill;
    const hue = hueOf(x.c);
    return '<div class="ui-row" title="' + esc(other) + ": " + x.w.e + " explicit · " + x.w.i + ' inferred">' +
      '<span class="ui-dot" style="background:' + hue + '"></span>' +
      '<span class="ui-id">' + esc(other) + '</span>' +
      '<span class="ui-bar">' +
      (x.w.e ? '<i style="width:' + (x.w.e / mx * 100).toFixed(1) + "%;background:" + hue + '"></i>' : "") +
      (x.w.i ? '<i style="width:' + (x.w.i / mx * 100).toFixed(1) + "%;background:" + hue + ';opacity:.32"></i>' : "") +
      '</span><span class="ui-num">e' + x.w.e + "·i" + x.w.i + "</span></div>";
  }).join("");
}
const usageLegend = '<span class="ui-dot" style="width:6px;height:6px;background:var(--text-dim)" title="solid = explicit"></span>' +
  '<span class="ui-dot" style="width:6px;height:6px;background:none;border:1px solid var(--text-dim)" title="faded = inferred"></span>';

function openSkill(name) {
  const s = (D.skills || []).find(x => x.name === name);
  if (!s) return;
  const g = s.governance || {};
  let chips = '<span class="ui-chip">' + esc(s.pack) + "</span>";
  if (s.runtime_safe) chips += '<span class="ui-chip rt" title="member of the 6-skill runtime-safe core">runtime-safe</span>';
  const st = STATE_CHIP[g.state];
  if (st) chips += '<span class="ui-chip ' + st[0] + '">' + esc(st[1]) + "</span>";
  let html = '<div class="ui-row" style="flex-wrap:wrap">' + chips + "</div>" +
    '<div class="ui-note">' + esc(s.purpose || "") + "</div>";

  html += '<div class="ui-sec" title="' + esc(D.matrix.method_note || "") + '">usage ' + usageLegend + "</div>" +
    usageRows("skill", name, c => U.agentHue(c.agent));
  const u = s.usage || {};
  html += U.kv("window e·i", (() => {
    const w = (D.matrix.cells || []).filter(c => c.skill === name)
      .reduce((a, c) => { const x = sliceCell(c); a.e += x.e; a.i += x.i; return a; }, { e: 0, i: 0 });
    return "e" + w.e + " · i" + w.i;
  })()) + U.kv("all-time e·i", "e" + (u.explicit || 0) + " · i" + (u.inferred || 0)) +
    U.kv("last used", esc(u.last_used || "—"));

  const props = (Array.isArray(D.inbox) ? D.inbox : []).map(attentionItem)
    .filter(it => it.kind === "proposal_review" && it.link && it.link.skill === name);
  const heal = g.healed;
  if (props.length || (heal && heal.proposal_id)) {
    html += '<div class="ui-div"></div><div class="ui-sec">proposal</div>';
    props.forEach(p => {
      html += '<div class="ui-row" title="' + esc(p.title) + '">' +
        '<span class="ui-dot" style="background:var(--idle)"></span>' +
        '<span class="ui-id" style="color:var(--text)">' + esc(p.id) + '</span>' +
        "<span style='flex:1'></span><span class='ui-pill warn'>open</span></div>";
    });
    if (heal && heal.proposal_id) {
      html += '<div class="ui-row"><span class="ui-dot" style="background:var(--ok)"></span>' +
        '<span class="ui-id" style="color:var(--text)">' + esc(heal.proposal_id) + '</span>' +
        "<span style='flex:1'></span><span class='ui-pill ok'>accepted " + esc(heal.accepted_at || "") + "</span></div>";
    }
  }

  html += '<div class="ui-div"></div>';
  if (g.conformance) html += '<div class="ui-note" title="memory/conformance.md">▲ ' + esc(g.conformance) + "</div>";
  if (g.drift && g.drift.open_note) html += '<div class="ui-note" style="color:var(--warn)">' + esc(g.drift.open_note) + "</div>";
  if (g.healed && g.healed.rule_id) html += U.kv("healed by", esc(g.healed.rule_id) + " · " + esc(g.healed.accepted_at || ""));
  if (g.new) html += U.kv("born", esc(g.new.born) + " · " + esc(g.new.via));
  U.panel.open(name, html);
}

function openLoop() {

}

/* ---------- contracts ---------- */
const CONTRACT_FAILURE_STATUSES = new Set(["aborted", "escalated", "budget_exceeded"]);
function contractText(value, missing = "unknown") {
  if (value === null || value === undefined) return missing;
  if (typeof value === "string") return value;
  if (typeof value === "number" || typeof value === "boolean" || typeof value === "bigint") {
    return String(value);
  }
  try {
    const encoded = JSON.stringify(value);
    return encoded === undefined ? missing : encoded;
  } catch (_) {
    return "unavailable";
  }
}
function contractEvaluation(c) {
  const status = typeof c.status === "string" && c.status ? c.status : null;
  const check = typeof c.done_check === "string" && c.done_check ? c.done_check : "unverified";
  let state = "unknown";
  if (status === "spawned" || status === "running") state = "pending";
  else if (status === "completed" && check === "pass") state = "pass";
  else if (status === "completed" && ["fail", "inconclusive"].includes(check)) state = check;
  else if (CONTRACT_FAILURE_STATUSES.has(status)) state = check === "pass" ? "contradiction" : "fail";

  // A projected warning may make the derived state more conservative, never
  // upgrade an incompatible terminal/check pair to pass.
  if (c.evaluation_state === "contradiction") state = "contradiction";
  else if (c.evaluation_state === "unknown" && state === "pass") state = "unknown";
  else if (c.evaluation_state === "fail" && state !== "contradiction") state = "fail";
  else if (c.evaluation_state === "pending" && state === "unknown") state = "pending";

  const label = state === "pass" ? "reported pass"
    : state === "fail" ? (CONTRACT_FAILURE_STATUSES.has(status) ? "terminal failure" : "reported fail")
    : state === "inconclusive" ? "reported inconclusive"
    : state === "contradiction" ? "status/check conflict"
    : state;
  return {
    state, label, check,
    status: status || "unknown",
    cls: state === "pass" ? "ok" : ["fail", "contradiction"].includes(state) ? "bad" : "warn",
  };
}
function contractPlannedWall(c) {
  const budget = c && c.budget;
  if (!budget || typeof budget !== "object" || Array.isArray(budget) ||
      !Object.prototype.hasOwnProperty.call(budget, "wall_time_seconds")) return "planned —";
  if (budget.wall_time_seconds === null || budget.wall_time_seconds === undefined) return "planned unknown";
  if (typeof budget.wall_time_seconds !== "number" || !Number.isFinite(budget.wall_time_seconds) || budget.wall_time_seconds < 0)
    return "planned unknown (invalid duration)";
  return "planned " + budget.wall_time_seconds + "s";
}
function contractInteractive(row, action) {
  row.tabIndex = 0;
  row.setAttribute("role", "button");
  row.addEventListener("click", action);
  row.addEventListener("keydown", event => {
    if (event.key !== "Enter" && event.key !== " ") return;
    if (event.preventDefault) event.preventDefault();
    action();
  });
}
function contractRow(c) {
  const evaluation = contractEvaluation(c);
  const r = document.createElement("div");
  r.className = "row";
  r.title = "spawn " + contractText(c.spawn_id, "") + " · " + contractText(c.task, "") +
    " · terminal state: " + evaluation.status + " · reported check: " + evaluation.check +
    " · evaluation: " + evaluation.label;
  r.innerHTML =
    '<span class="rid w">' + esc(c.spawn_id) + "</span>" +
    '<span class="aid"><span class="dot" style="background:' + U.agentHue(c.agent) + '"></span>' + esc(c.agent) + "</span>" +
    '<span class="rmono">' + esc(evaluation.status) + "</span>" +
    '<span class="ui-pill ' + evaluation.cls + '">' + esc(evaluation.check) + "</span>" +
    (evaluation.state === "contradiction" ? '<span class="nbadge">status/check conflict</span>' : "") +
    "<span style='flex:1'></span>" +
    '<span class="rmono">' + esc(contractPlannedWall(c)) + "</span>" +
    '<span class="rmono">' + U.fmtAge(c.age_days) + "</span>";
  contractInteractive(r, () => openContract(c));
  return r;
}
function renderContracts() {
  const host = $("contracts");
  host.innerHTML = "";
  const all = D.contracts || [];
  (all.length > 9 ? all.slice(0, 8) : all).forEach(c => host.appendChild(contractRow(c)));
  if (all.length > 9) {
    const r = document.createElement("div");
    r.className = "row more";
    r.innerHTML = '<span class="rtxt">show all ' + all.length + "</span>";
    contractInteractive(r, () => U.panel.open("contracts · " + all.length, all.map(c => {
      const evaluation = contractEvaluation(c);
      return '<details class="ui-item"><summary class="ui-row contract-summary">' +
        '<span class="ui-dot" style="background:' + U.agentHue(c.agent) + '"></span>' +
        '<span class="ui-id" style="color:var(--text)">' + esc(c.spawn_id) + "</span>" +
        '<span class="ui-note" style="flex:1">' + esc(c.task || "") + "</span>" +
        '<span class="ui-num">' + esc(evaluation.status) + "</span>" +
        '<span class="ui-pill ' + evaluation.cls + '">' + esc(evaluation.check) + "</span>" +
        (evaluation.state === "contradiction" ? '<span class="nbadge">status/check conflict</span>' : "") +
        '<span class="ui-num">' + U.fmtAge(c.age_days) + "</span></summary>" + contractDetailsHTML(c) + "</details>";
    }).join("")));
    host.appendChild(r);
  }
}
function contractDetailsHTML(c) {
  const evaluation = contractEvaluation(c);
  const rawCheck = c.done_check_raw ?? "";
  // JSON is display text for container receipts, independent of the verdict;
  // malformed coercion hooks must not interrupt the rest of the evidence.
  const rawCheckText = contractText(rawCheck, "");
  const plannedBudget = contractText(c.budget || {}, "{}");
  const plannedWall = contractPlannedWall(c).replace(/^planned /, "");
  const html =
    '<div class="ui-row"><span class="ui-dot" style="background:' + U.agentHue(c.agent) + '"></span>' +
    '<span class="ui-id" style="width:auto">' + esc(c.agent) + "</span>" +
    '<span class="ui-chip">' + esc(c.surface) + "</span>" +
    "<span style='flex:1'></span><span class='ui-pill " + evaluation.cls + "'>" + esc(evaluation.check) + "</span></div>" +
    '<div class="ui-title">' + esc(c.task || "") + "</div>" +
    U.kv("date", esc(c.date) + " · " + U.fmtAge(c.age_days) + " ago") +
    '<details><summary>Source times and evaluator context</summary>' +
    U.kv("launched (source timestamp)", esc(contractText(c.started_at))) +
    U.kv("terminal update (source timestamp)", esc(contractText(c.status_at))) +
    U.kv("terminal state", esc(evaluation.status)) +
    U.kv("done-check", esc(rawCheckText)) +
    U.kv("reported done-check class", esc(evaluation.check)) +
    U.kv("evaluation", esc(evaluation.label)) +
    U.kv("evaluator (source-reported)", esc(contractText(c.verified_by))) +
    U.kv("verification time (source-reported)", esc(contractText(c.verified_at))) +
    U.kv("state basis (source-reported)", esc(contractText(c.state_basis))) +
    U.kv("child report", esc(contractText(c.child_summary))) +
    U.kv("parent evaluation", esc(contractText(c.parent_observations))) +
    "</details>" +
    U.kv("authority cap", esc(contractText(c.authority_cap, ""))) +
    U.kv("planned wall time", esc(plannedWall)) +
    U.kv("planned budget", esc(plannedBudget)) +
    U.kv("actual usage", "unknown (no receipt)") +
    '<div class="ui-sec">skill subset</div><div class="ui-row" style="flex-wrap:wrap">' +
    (c.skill_subset || []).map(s => '<span class="ui-chip" data-skill="' + esc(s) + '">' + esc(s) + "</span>").join("") +
    "</div>";
  return html;
}
function openContract(c) {
  U.panel.open(c.spawn_id, contractDetailsHTML(c));
}

/* ---------- timeline ---------- */
const KIND_COLOR = {
  proposal: "var(--idle)", proposal_review: "var(--idle)", decision: "var(--accent)",
  correction: "var(--bad)", reflection: "var(--text-faint)", spawn: "var(--agent-other)",
  harvest: "var(--agent-nemoclaw)", rule: "var(--ok)"
};
const kindColor = k => KIND_COLOR[k] || "var(--text-ghost)";
const winRows = () => (D.timeline || []).filter(t => inWin(t.date))
  .sort((a, b) => String(b.ts || b.date).localeCompare(String(a.ts || a.date)));

function tlRow(t) {
  const r = document.createElement("div");
  r.className = "row" + (t.is_flag ? " flag" : "");
  r.title = t.kind + " " + t.id + " · " + (t.agent || "") +
    (t.verdict ? " · " + t.verdict : "") + (t.skill ? " · skill: " + t.skill : "") +
    (t.is_flag ? " · ⚑ flagged" : "");
  r.innerHTML =
    '<span class="rmono">' + U.fmtDate(t.date) + "</span>" +
    '<span class="dot" style="background:' + kindColor(t.kind) + '" title="' + esc(t.kind) + '"></span>' +
    '<span class="rid">' + esc(t.id) + "</span>" +
    '<span class="rtxt">— ' + esc(t.title) + "</span>" +
    '<span class="dot" style="background:' + U.agentHue(t.agent) + '" title="' + esc(t.agent || "") + '"></span>';
  r.addEventListener("click", () => openTimeline());
  return r;
}
function renderTimeline() {
  const host = $("timeline");
  host.innerHTML = "";
  const rows = winRows();
  if (!rows.length) {
    host.innerHTML = '<div class="row" style="cursor:default"><span class="rtxt" style="color:var(--text-ghost)">0 brain events in last ' +
      windowDays + "d</span></div>";
    return;
  }
  (rows.length > 9 ? rows.slice(0, 8) : rows).forEach(t => host.appendChild(tlRow(t)));
  if (rows.length > 9) {
    const r = document.createElement("div");
    r.className = "row more";
    r.innerHTML = '<span class="rtxt">show all ' + rows.length + "</span>";
    r.addEventListener("click", () => openTimeline());
    host.appendChild(r);
  }
}
function openTimeline() {
  const rows = winRows();
  const html = rows.map(t =>
    '<div class="ui-item' + (t.is_flag ? '" style="box-shadow:inset 2px 0 0 var(--warn);padding-left:8px' : "") + '">' +
    '<div class="ui-row" style="min-height:20px">' +
    '<span class="ui-num">' + esc(t.date) + "</span>" +
    '<span class="ui-dot" style="width:6px;height:6px;background:' + kindColor(t.kind) + '"></span>' +
    '<span class="ui-num">' + esc(t.kind) + "</span>" +
    '<span class="ui-id" style="flex:1;width:auto;color:var(--text)">' + esc(t.id) + "</span>" +
    (t.verdict ? '<span class="ui-pill warn">' + esc(t.verdict) + "</span>" : "") +
    '<span class="ui-dot" style="background:' + U.agentHue(t.agent) + '" title="' + esc(t.agent || "") + '"></span></div>' +
    '<div class="ui-note">' + esc(t.title) + "</div>" +
    (t.skill ? '<div class="ui-row" style="min-height:18px"><span class="ui-chip" data-skill="' + esc(t.skill) + '">' + esc(t.skill) + "</span></div>" : "") +
    "</div>").join("");
  U.panel.open("timeline · last " + windowDays + "d · " + rows.length + " events", html);
}

/* ---------- rules ---------- */
function ruleRow(x) {
  const r = document.createElement("div");
  r.className = "row";
  r.title = x.imperative || "";
  r.innerHTML =
    '<span class="rid w">' + esc(x.id) + "</span>" +
    '<span class="rtxt">' + esc(x.title) + "</span>" +
    (x.enforced_count > 0 ? '<span class="nbadge">×' + x.enforced_count + "</span>" : '<span class="nzero">—</span>');
  r.addEventListener("click", () => {
    U.panel.open(x.id,
      '<div class="ui-title">' + esc(x.title) + "</div>" +
      '<div class="ui-note">' + esc(x.imperative || "") + "</div>" +
      U.kv("enforced", "×" + (x.enforced_count || 0)) +
      U.kv("since", esc(x.date || "")) +
      (x.extends_skill ? '<div class="ui-sec">extends</div><div class="ui-row"><span class="ui-chip" data-skill="' +
        esc(x.extends_skill) + '">' + esc(x.extends_skill) + "</span></div>" : ""));
  });
  return r;
}
function renderRules() {
  const host = $("rules");
  host.innerHTML = "";
  const all = D.rules || [];
  (all.length > 9 ? all.slice(0, 8) : all).forEach(x => host.appendChild(ruleRow(x)));
  if (all.length > 9) {
    const r = document.createElement("div");
    r.className = "row more";
    r.innerHTML = '<span class="rtxt">show all ' + all.length + "</span>";
    r.addEventListener("click", () => U.panel.open("rules · " + all.length, all.map(x =>
      '<div class="ui-item"><div class="ui-row">' +
      '<span class="ui-id" style="color:var(--text)">' + esc(x.id) + "</span>" +
      '<span class="ui-note" style="flex:1">' + esc(x.title) + "</span>" +
      '<span class="ui-num">×' + (x.enforced_count || 0) + "</span></div>" +
      '<div class="ui-note">' + esc(x.imperative || "") + "</div></div>").join("")));
    host.appendChild(r);
  }
}

/* ---------- per-day chips ---------- */
function renderDays() {
  const host = $("days");
  host.innerHTML = "";
  const days = (D.days || []).slice().sort((a, b) => b.date.localeCompare(a.date));
  days.slice(0, 8).forEach(d => {
    const a = document.createElement("a");
    a.className = "chipday";
    a.href = d.file;
    a.title = d.date + " rendered view · " + d.bytes + " bytes";
    a.textContent = U.fmtDate(d.date) + " · " + U.fmtBytes(d.bytes);
    host.appendChild(a);
  });
  if (days.length > 8) {
    const m = document.createElement("span");
    m.className = "chipday";
    m.textContent = "all " + days.length;
    m.title = "open the full day list";
    m.addEventListener("click", () => U.panel.open("days · " + days.length, days.map(d =>
      '<div class="ui-row"><a class="ui-id" style="width:auto" href="' + esc(d.file) + '">' + esc(d.date) +
      '</a><span style="flex:1"></span><span class="ui-num">' + U.fmtBytes(d.bytes) + "</span></div>").join("")));
    host.appendChild(m);
  }
}

/* ---------- footer ---------- */
function paintFooter() {
  $("foot").innerHTML = "schema v" + D.schema_version + " · generated " + esc(U.fmtTs(D.generated_at)) +
    ' · sources <span title="' + esc(D.repo + " → " + D.consumer) + '">' +
    esc(D.repo.split("/").pop() + " → " + D.consumer.split("/").pop()) + "</span>" +
    ' · <span title="' + esc((D.attribution || {}).note || "") + '">agent ' +
    (D.attribution || {}).agent_rows + "/" + (D.attribution || {}).total_rows + "</span>";
}

/* ---------- paint: render every data-driven band from the active summary D ----
   Runs on initial load and on each live poll. mountMap is deliberately NOT here —
   it stays mounted across polls so a user's zoom/pan on the embedded map survives
   (map data is static between regens), and is (re)mounted on boot and on window
   changes instead. */
function paint() {
  asof = (D.generated_at || "").slice(0, 10);
  $("asof").textContent = asof;
  $("asof").title = "as of " + U.fmtTs(D.generated_at);
  renderStepper();
  renderStatus();
  renderInbox();
  renderLoop();
  renderContracts();
  renderTimeline();
  renderRules();
  renderDays();
  paintFooter();
}

/* ---------- projection data: independently fetched, explicitly attributed ----
   Saved files and last successful responses remain available on request failure.
   The source strip discloses each fallback and generation time. Successful
   responses do not establish that both projections describe the same revision.
   The existing ~30s page refresh retains the view on failure.
   The map is only remounted when its content changes (signature compare excluding
   generated_at), so a user's zoom/pan survives polls that bring no map change. */
const summarySource = U.dataSource(D, U.usableSummary);
const mapSource = U.dataSource(M, U.usableMap);
const operationsSource = U.dataSource(null, d => d.read_only === true && !!d.server);
function showSources() {
  U.renderDataStatus($("data-source-status"), summarySource, mapSource, $("data-source-announcement"));
}
async function refreshData(current) {
  const update = changed => {
    if (!current()) return changed;
    const prior = D;
    D = summarySource.data;
    M = mapSource.data;
    showSources();
    if (D && D !== prior) { if (!prior) initWindowState(); paint(); }
    const sig = mapSig();
    if (sig !== lastMapSig) { lastMapSig = sig; mountMap(); }
    return changed;
  };
  return Promise.all([summarySource.refresh("api/summary").then(update), mapSource.refresh("api/map").then(update)]);
}
function fetchLive(path, valid) {
  return operationsSource.refresh(path).then(ok => ok && valid(operationsSource.data) ? operationsSource.data : null);
}
const fetchLiveOperations = () => fetchLive("api/operations", d => d.read_only === true && !!d.server);
function showOperationsSource() {
  $("operations-source-status").textContent = U.describeDataSource("Operations", operationsSource);
}
// Render signature = exactly what the map draws from, sans generated_at: the map
// payload (nodes/edges/cards) plus the slices of D the renderer reads — skills
// (governance halos), matrix (windowed edge weights), agents (run counts), window.
// Excludes non-map summary fields (timeline/inbox/…) so an unrelated change never
// resets the user's zoom; covers every map-visible field so a real change always
// remounts. Deterministic projectors make it byte-stable for identical ledgers.
function mapSig() {
  return JSON.stringify([
    M && [M.nodes, M.edges, M.cards],
    D && [D.skills, D.matrix, D.agents, D.window],
  ]);
}
let lastMapSig = "";

// Paint saved content before starting any request. Each source paints on its
// own completion; a hanging operations response cannot hold back projections.
D = summarySource.data;
M = mapSource.data;
if (D) { initWindowState(); paint(); }
showSources();
renderOperations(location.protocol === "http:" || location.protocol === "https:" ? "loading" : "unavailable");
showOperationsSource();
lastMapSig = mapSig();
mountMap();
if (location.protocol !== "http:" && location.protocol !== "https:") reviewUiPresent = true;
U.pageRefresh(current => Promise.all([
  refreshData(current),
  (() => { if (!O) renderOperations("loading"); return fetchLiveOperations(); })().then(live => {
    if (!current()) return;
    if (live) O = live;
    renderOperations();
    showOperationsSource();
  }),
  probeReviewUi(current),
]), () => {
  summarySource.cancel(); mapSource.cancel(); operationsSource.cancel(); reviewSource.cancel();
  // A cancelled optimistic HEAD probe is checked again after restoration.
  // Presence of this link grants no verdict authority.
  if (reviewSource.error === "request cancelled") reviewUiPresent = null;
});
}
})();
