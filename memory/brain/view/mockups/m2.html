:root {

* { box-sizing:border-box; }
html,body { margin:0; padding:0; }
body { background:var(--bg); color:var(--text); font:13px/1.45 system-ui,sans-serif; }

a { color:var(--text-dim); text-decoration:none; }

.card { border:1px solid var(--border); background:var(--surface-2); border-radius:6px; }

/* header */
header { display:flex; align-items:center; gap:18px; height:48px; padding:0 16px;

.wordmark { font-weight:600; font-size:13px; letter-spacing:.02em; white-space:nowrap; }

nav.views a { padding:3px 10px; border-radius:4px; font-size:12px; color:var(--text-dim); }
nav.views a.on { background:var(--surface); color:var(--text); border:1px solid var(--border-2); }
.spacer { flex:1; }
.stepper { display:flex; align-items:center; gap:3px; }
.stepper b { width:18px; height:18px; border:1px solid var(--border); border-radius:4px;

  display:flex; align-items:center; justify-content:center; cursor:default; }
.stepper b.on { border-color:var(--accent); color:var(--ok); background:var(--ok-bg); }
.asof { font-family:var(--font-mono); font-size:11px; color:var(--text-faint); }
.xnav { font-size:12px; }

/* status strip */
#strip { display:flex; align-items:center; height:36px; border-bottom:1px solid var(--border);
  padding:0 16px; gap:0; overflow:hidden; }
.seg { display:flex; align-items:center; gap:7px; padding:0 16px; height:100%;

.seg:first-child { padding-left:0; }
.seg .num { font-family:var(--font-mono); font-size:13px; color:var(--text); }
.dot { width:8px; height:8px; border-radius:50%; display:inline-block; flex:none; }
.d-warn { background:var(--warn); box-shadow:0 0 6px rgba(251,191,36,.55); }
.d-ok { background:var(--ok); } .d-bad { background:var(--bad); } .d-idle { background:var(--idle); }
.d-half { background:conic-gradient(var(--warn) 0 50%, var(--border-2) 50% 100%); }
.w-warn { color:var(--warn); } .w-ok { color:var(--ok); } .w-bad { color:var(--bad); }

/* layout */
#main { display:flex; gap:12px; padding:12px 16px; align-items:flex-start; }

#pane { flex:1; min-width:0; display:flex; flex-direction:column; gap:10px; }

/* inbox */
.band { padding:8px 10px; }
.band > .lbl { display:flex; justify-content:space-between; margin-bottom:6px; }
.empty { color:var(--text-ghost); font-size:12px; padding:8px 2px; }
.irow { display:flex; align-items:center; gap:8px; padding:5px 4px; border-top:1px solid var(--border);

.irow:hover { background:var(--surface); }

.irow .age, .icard .age { font-family:var(--font-mono); font-size:10px; color:var(--text-ghost); flex:none; }
.kind { font-size:9px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint);

.cnt { font-family:var(--font-mono); font-size:10px; color:var(--text-faint); flex:none; }
.sev-high { background:var(--bad); box-shadow:0 0 6px rgba(248,113,113,.6); }
.sev-med { background:var(--warn); } .sev-low { background:var(--idle); }
.icard { border:1px solid var(--border-2); border-radius:6px; background:var(--surface);

.icard .hd { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
.icard .ttl { font-size:12px; color:var(--text); flex:1; }

.copy { font:10px var(--font-mono); color:var(--text-faint); background:none;
  border:1px solid var(--border); border-radius:3px; padding:2px 6px; cursor:pointer; flex:none; }
.copy:hover { color:var(--text); border-color:var(--border-2); }

/* loop strip + contracts */
.loopline { display:flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:11px;
  color:var(--text-dim); flex-wrap:wrap; padding:2px 0; }
.loopline .arr { color:var(--text-ghost); }
.loopline .stage { display:flex; align-items:center; gap:4px; white-space:nowrap; }

.crow .id { font-family:var(--font-mono); font-size:11px; color:var(--text); }

.p-ok { color:var(--ok); background:var(--ok-bg); border:1px solid rgba(52,211,153,.35); }
.p-warn { color:var(--warn); background:var(--warn-bg); border:1px solid rgba(251,191,36,.35); }
.p-bad { color:var(--bad); background:var(--bad-bg); border:1px solid rgba(248,113,113,.35); }

#mapbox svg { display:block; width:100%; height:100%; }
#maphead { position:absolute; top:8px; left:12px; right:12px; display:flex; align-items:center;

.legend { display:flex; gap:12px; align-items:center; margin-left:auto; }
.legend i { width:10px; height:10px; border-radius:50%; display:inline-block; }
.lanehdr { font:10px system-ui; text-transform:uppercase; letter-spacing:.1em; fill:var(--text-faint); }
.nlbl { font:10px var(--font-mono); fill:var(--text-dim); }
.nlbl2 { font:9px var(--font-mono); fill:var(--text-ghost); }
.alabel { font:10px var(--font-mono); fill:var(--text-dim); text-anchor:middle; }
.aruns { font:9px var(--font-mono); fill:var(--text-ghost); text-anchor:middle; }
.nlbl,.nlbl2,.alabel,.aruns,.lanehdr { paint-order:stroke; stroke:#09090b; stroke-width:3px; stroke-linejoin:round; }
@keyframes pulse { 0%,100% { opacity:.85; } 50% { opacity:.25; } }
.healed { animation:pulse 2.4s ease-in-out infinite; }
.nodehit { cursor:pointer; }

/* hover card */
#hover { position:absolute; min-width:150px; max-width:210px; background:var(--surface);

#hover .hs { font-family:var(--font-mono); font-size:10.5px; color:var(--text-dim); margin-top:3px; }

#side { width:272px; flex:none; border-left:1px solid var(--border); background:var(--surface-2);

#side h2 { font:600 14px var(--font-mono); margin:0 0 6px; display:flex; gap:8px; align-items:center; }
#side .sec { margin-top:12px; }

.usage .ua { flex:1; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

.unum { color:var(--text-faint); font-size:10px; width:46px; text-align:right; flex:none; }
.prow { display:flex; gap:7px; align-items:center; padding:4px 0; font-size:12px; }
.prow .id { font-family:var(--font-mono); font-size:11px; }
.note { font-size:11.5px; color:var(--text-dim); }

#drawer { overflow:hidden; }
#drawbar { display:flex; align-items:center; gap:10px; padding:7px 12px; cursor:pointer; }
#drawbar .dots { display:flex; gap:5px; align-items:center; }
#drawbar .chev { margin-left:auto; color:var(--text-faint); font-size:10px; }
#drawrows { display:none; border-top:1px solid var(--border); }
#drawer.open #drawrows { display:block; }
.trow { display:flex; align-items:center; gap:9px; padding:4px 12px; border-top:1px solid var(--border);

.trow:first-child { border-top:none; }
.trow.flag { background:rgba(69,10,10,.45); }
.trow .d { font-family:var(--font-mono); font-size:10px; color:var(--text-ghost); flex:none; }
.trow .id { font-family:var(--font-mono); font-size:11px; color:var(--text); flex:none; }
.trow .t { flex:1; min-width:0; color:var(--text-dim); white-space:nowrap; overflow:hidden;
  text-overflow:ellipsis; }

/* rules + footer */
#rules { display:flex; gap:10px; padding:0 16px 8px; }
.rrow { flex:1; display:flex; align-items:center; gap:8px; padding:6px 10px; font-size:11.5px;
  min-width:0; }
.rrow .id { font-family:var(--font-mono); font-size:11px; color:var(--ok); flex:none; }
.rrow .t { flex:1; min-width:0; max-width:38ch; color:var(--text-dim); white-space:nowrap; overflow:hidden;
  text-overflow:ellipsis; }
.rrow .n { font-family:var(--font-mono); font-size:10px; color:var(--text-faint); flex:none; }
footer { display:flex; gap:8px; align-items:center; padding:8px 16px 14px;
  font-family:var(--font-mono); font-size:11px; color:var(--text-ghost); }
</style>

    '<div class="cmd"><code id="topcmd" title="'+esc(top.cmd)+'">'+esc(top.cmd)+'</code>'+
    '<button class="copy" onclick="navigator.clipboard&&navigator.clipboard.writeText(document.getElementById(\'topcmd\').textContent);this.textContent=\'✓\'">copy</button></div></div>';
  h += rest.map(r =>
    '<div class="irow" title="'+esc(r.title)+' — '+esc(r.cmd)+'">'+
    '<span class="dot sev-'+r.sev+'"></span><span class="kind">'+r.kind.replace("_"," ")+'</span>'+
    '<span class="cnt">×'+r.count+'</span><span class="t">'+esc(r.title)+'</span>'+
    '<span class="age">'+r.age+'</span></div>').join("");
  $("#inbox").innerHTML = h;
})();

/* ---- healing loop strip ---- */
$("#loopline").innerHTML =
  '<span class="stage" title="harvest runs · dormant '+DATA.loop.harvest.dormant_days+'d">harvest '+DATA.loop.harvest.n+
  ' <span class="w-warn">◐'+DATA.loop.harvest.dormant_days+'d</span></span><span class="arr">→</span>'+
  '<span class="stage" title="proposals open">'+DATA.loop.proposals_open+' open</span><span class="arr">→</span>'+
  '<span class="stage" title="review: accepted / rejected / human"><span class="w-ok">✓'+DATA.loop.review.ok+
  '</span> <span class="w-bad">✗'+DATA.loop.review.rej+'</span></span><span class="arr">→</span>'+
  '<span class="stage" title="enacted">'+DATA.loop.enacted.rules+' rules · '+DATA.loop.enacted.skills+' skills</span>';

/* ---- contracts ---- */
$("#contractn").textContent = DATA.contracts.length;
$("#contracts").innerHTML = DATA.contracts.map(c =>
  '<div class="crow" title="spawn contract '+c.id+' · done-check: '+c.check+'">'+
  '<span class="id">'+c.id+'</span><span class="ag">'+c.agent+'</span>'+
  '<span class="pill '+(c.check==="pass"?"p-ok":"p-warn")+'">'+c.check+'</span>'+
  '<span class="b">'+c.budget+'</span><span class="age">'+c.age+'</span></div>').join("");

/* ---- map ---- */
const NS = "http://www.w3.org/2000/svg";
const svg = $("#map");
function el(tag, at, parent){ const e = document.createElementNS(NS, tag);
  for (const k in at) e.setAttribute(k, at[k]); (parent||svg).appendChild(e); return e; }

const laneX = {core:330, research:478, meta:626, brain:774};
const pos = {};   // skill -> {x,y}
const apos = {};  // agent -> {x,y,r,hue}
const gBands = el("g",{}), gEdges = el("g",{}), gNodes = el("g",{});

Object.keys(PACKS).forEach(p => {
  const x = laneX[p];
  el("rect",{x:x-26, y:66, width:138, height:646, rx:6, fill:"rgba(24,24,27,.45)",
    stroke:"var(--border)", "stroke-width":1}, gBands);
  const t = el("text",{x:x-14, y:84, class:"lanehdr"}, gBands); t.textContent = p;
  const n = PACKS[p].length, y0 = 104, y1 = 700;
  PACKS[p].forEach((s,i) => { pos[s] = {x:x, y:y0+(i+.5)*(y1-y0)/n}; });
});

DATA.agents.forEach((a,i) => {
  apos[a.id] = {x:110, y:118+i*106, r:10+1.6*Math.sqrt(a.runs), hue:a.hue, runs:a.runs};
});

DATA.matrix.forEach(m => {
  const A = apos[m.a], S = pos[m.s]; if (!A || !S) return;
  const x1 = A.x+A.r+2, y1 = A.y, x2 = S.x-13, y2 = S.y, mx = (x1+x2)/2;
  el("path",{d:"M"+x1+" "+y1+" C "+mx+" "+y1+", "+mx+" "+y2+", "+x2+" "+y2,
    fill:"none", stroke:A.hue, "stroke-opacity":.55, "stroke-width":(1+2*Math.sqrt(m.e+m.i)).toFixed(1),
    ...(m.e>0?{}:{"stroke-dasharray":"6 5"})}, gEdges);
});

DATA.agents.forEach(a => {
  const p = apos[a.id], zero = !DATA.matrix.some(m => m.a===a.id);
  const g = el("g",{opacity:zero?.45:1}, gNodes);
  el("circle",{cx:p.x, cy:p.y, r:p.r, fill:a.hue, "fill-opacity":.16, stroke:a.hue, "stroke-width":1.5}, g);
  const t = el("text",{x:p.x, y:p.y+p.r+13, class:"alabel"}, g); t.textContent = a.id;
  const ti = el("title",{}, g); ti.textContent = a.id+" · "+a.runs+" runs"+(zero?" · awaiting attribution":"");
  if (zero){ const w = el("text",{x:p.x, y:p.y+p.r+24, class:"aruns"}, g); w.textContent = "awaiting attribution"; }
});

const edgeAgg = s => { let e=0,i=0,ag=0; DATA.matrix.forEach(m=>{ if(m.s===s){e+=m.e;i+=m.i;ag++;} }); return {e,i,ag}; };

Object.keys(PACKS).forEach(p => PACKS[p].forEach(s => {
  const {x,y} = pos[s], g = el("g",{class:"nodehit", opacity:has("by_design",s)?.4:1}, gNodes);
  if (has("drift",s)){ el("circle",{cx:x,cy:y,r:17,fill:"none",stroke:"var(--warn)","stroke-opacity":.25,"stroke-width":4},g);
                       el("circle",{cx:x,cy:y,r:14,fill:"none",stroke:"var(--warn)","stroke-width":1.6},g); }
  if (has("healed",s)) el("circle",{cx:x,cy:y,r:15,fill:"none",stroke:"var(--ok)","stroke-width":2,class:"healed"},g);
  if (has("fresh",s))  el("circle",{cx:x,cy:y,r:12,fill:"none",stroke:"var(--text)","stroke-width":1,"stroke-dasharray":"3 3","stroke-opacity":.8},g);
  el("circle",{cx:x,cy:y,r:9,fill:"var(--surface)",stroke:"var(--border-2)","stroke-width":1.2},g);
  if (has("runtime_safe",s)) el("circle",{cx:x,cy:y,r:5,fill:"none",stroke:"var(--accent)","stroke-width":1.2},g);
  if (s==="run-log") el("circle",{cx:x,cy:y,r:20,fill:"none",stroke:"var(--text)","stroke-opacity":.3,"stroke-width":1},g); // selected
  const t = el("text",{x:x+15,y:y+3,class:"nlbl"},g); t.textContent = s;
  if (has("by_design",s)){ const r = el("text",{x:x+15,y:y+13,class:"nlbl2"},g); r.textContent = "ref-only"; }
  const states = ["drift","healed","fresh","by_design","runtime_safe"].filter(k=>has(k,s)).join(" · ") || "steady";
  const hit = el("circle",{cx:x,cy:y,r:18,fill:"transparent"},g);
  const agg = edgeAgg(s);
  hit.addEventListener("mouseenter", () => showHover(s, p, states, agg, x, y));
  hit.addEventListener("mouseleave", () => { $("#hover").hidden = true; });
}));

function showHover(s, pack, states, agg, x, y){
  const hv = $("#hover");
  hv.innerHTML = '<div class="hn">'+s+'</div><div class="hp">'+pack+' · '+states.replace("by_design","ref-only").replace("runtime_safe","rt-safe")+
    '</div><div class="hs">e '+agg.e+' · i '+agg.i+' · '+agg.ag+' agent'+(agg.ag===1?"":"s")+'</div>';
  const pt = svg.createSVGPoint(); pt.x = x; pt.y = y;
  const sp = pt.matrixTransform(svg.getScreenCTM());
  const box = $("#mapbox").getBoundingClientRect();
  hv.style.left = Math.min(sp.x - box.x + 22, box.width - 220) + "px";
  hv.style.top  = Math.max(sp.y - box.y - 14, 6) + "px";
  hv.hidden = false;
}
/* pinned hover demo on load */
requestAnimationFrame(() => showHover("validate", "core",
  ["drift","healed","fresh","by_design","runtime_safe"].filter(k => has(k,"validate")).join(" · ") || "steady",
  edgeAgg("validate"), pos["validate"].x, pos["validate"].y));

/* ---- side panel (selected: run-log) ---- */
(function(){
  const rows = DATA.matrix.filter(m => m.s === "run-log");
  const max = Math.max(...rows.map(m => m.e + m.i));
  $("#side").innerHTML =
    '<h2>run-log <span class="pill p-warn" title="usage drifted from contract">drift</span>'+
    '<span class="pill p-ok" title="runtime-safe core (BOUNDARY.md)">rt-safe</span></h2>'+
    '<div class="sec"><div class="lbl" title="explicit (solid) vs inferred (dashed) attribution">usage e/i</div>'+
    rows.map(m => '<div class="usage"><span class="ua">'+m.a+'</span>'+
      '<span class="ubar"><i class="u-e" style="width:'+(m.e/max*100)+'%"></i><i class="u-i" style="width:'+(m.i/max*100)+'%"></i></span>'+
      '<span class="unum">'+m.e+'/'+m.i+'</span></div>').join("")+'</div>'+
    '<div class="sec"><div class="lbl">proposal</div>'+
    '<div class="prow" title="P-008 run-log agent attribution in a_bgt_rsi — filed 06-09"><span class="id w-warn">P-008</span>'+
    '<span class="note">agent attribution</span><span class="pill p-warn">open</span></div></div>'+
    '<div class="sec"><div class="lbl">conformance</div>'+
    '<div class="note" title="memory/conformance.md — friction ×3, diverged ×1, window 7d">friction ×3 · diverged ×1</div></div>';
})();

/* ---- timeline drawer ---- */
const hueOf = id => (DATA.agents.find(a=>a.id===id)||{hue:"var(--agent-other)"}).hue;
$("#drawdots").innerHTML = DATA.timeline.map(t =>
  '<span class="dot" style="width:7px;height:7px;background:'+hueOf(t.agent)+'" title="'+t.id+' · '+esc(t.t)+'"></span>').join("");
$("#drawrows").innerHTML = DATA.timeline.map(t =>
  '<div class="trow'+(t.flag?" flag":"")+'" title="'+esc(t.t)+' — '+t.agent+'">'+
  '<span class="d">'+t.d+'</span><span class="kind">'+t.kind+'</span><span class="id">'+t.id+'</span>'+
  '<span class="t">'+esc(t.t)+'</span><span class="dot" style="background:'+hueOf(t.agent)+'"></span></div>').join("");
$("#drawbar").addEventListener("click", () => {
  const d = $("#drawer"); d.classList.toggle("open");
  $("#chev").textContent = d.classList.contains("open") ? "▾" : "▴";
});

/* ---- rules ---- */
$("#rules").innerHTML = DATA.rules.map(r =>
  '<div class="rrow card" title="'+esc(r.t)+' — fired ×'+r.n+' this window">'+
  '<span class="id">'+r.id+'</span><span class="t">'+esc(r.t)+'</span><span class="n">×'+r.n+'</span></div>').join("");
</script>
</body>
</html>
