<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>brain · governance — m1 stack</title>
<style>
/* ====== BEGIN SHARED TOKENS v1 (synced copy; checked by scripts/check_design_tokens.py) ====== */
:root {
  --bg:#09090b; --surface:#18181b; --surface-2:rgba(24,24,27,.4);
  --border:#27272a; --border-2:#3f3f46;
  --text:#e4e4e7; --text-dim:#a1a1aa; --text-faint:#71717a; --text-ghost:#52525b;
  --accent:#10b981; --ok:#34d399; --warn:#fbbf24; --bad:#f87171; --idle:#38bdf8;
  --ok-bg:#022c22; --warn-bg:#451a03; --bad-bg:#450a0a;
  --agent-nara:#34d399; --agent-coordinator:#7dd3fc; --agent-workflow:#a5b4fc;
  --agent-claude:#c084fc; --agent-human:#a1a1aa; --agent-nemoclaw:#a78bfa; --agent-other:#fda4af;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
/* ====== END SHARED TOKENS v1 ====== */

html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.45 system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.mono{font-family:var(--font-mono)}
a,.link{color:var(--text-dim);text-decoration:none;cursor:pointer}
a:hover,.link:hover{color:var(--text)}

/* header */
header{display:flex;align-items:center;gap:16px;height:56px;padding:0 18px;border-bottom:1px solid var(--border)}
.brand{font-weight:600;letter-spacing:.02em;white-space:nowrap}
.brand .sep{color:var(--text-ghost);font-weight:400;margin:0 4px}
.brand .sub{color:var(--text-faint);font-weight:500}
nav.views{display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:2px}
nav.views .v{padding:3px 11px;border-radius:4px;color:var(--text-faint);font-size:12px}
nav.views .v.on{background:#27272a;color:var(--text)}
.hspace{flex:1}
.stepper{display:flex;gap:3px;align-items:center}
.tick{width:15px;height:15px;border:1px solid var(--border);border-radius:3px;display:grid;place-items:center;
  font-size:9px;color:var(--text-ghost);font-family:var(--font-mono);background:var(--surface-2)}
.tick.fill{background:#1b2a24;border-color:#1f3d33}
.tick.on{background:var(--ok-bg);border-color:var(--accent);color:var(--ok)}
.asof{font-family:var(--font-mono);color:var(--text-faint);font-size:12px}
.xnav{font-size:12px;white-space:nowrap}

main{padding:0 18px 28px}
section{margin-top:12px}
.band{border:1px solid var(--border);background:var(--surface-2);border-radius:6px;overflow:hidden}
.sec{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-faint);margin:0 2px 6px}

.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dmd{width:8px;height:8px;flex:none;transform:rotate(45deg)}

/* status strip */
#status{display:flex;height:46px;align-items:stretch}
.seg{flex:1;display:flex;align-items:center;gap:9px;padding:0 16px;border-left:1px solid var(--border);min-width:0}
.seg:first-child{border-left:none}
.seg .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);white-space:nowrap}
.seg .v{font-family:var(--font-mono);font-size:14px;color:var(--text)}
.seg .v.warn{color:var(--warn)} .seg .v.ok{color:var(--ok)} .seg .v.dim{font-size:12px;color:var(--text-dim)}
.ticksv{display:flex;gap:2px;align-items:flex-end;height:12px}
.ticksv i{width:3px;border-radius:1px;display:block}

/* inbox */
#inbox{display:grid;grid-template-columns:1fr minmax(380px,40%);min-height:188px}
.irows{display:flex;flex-direction:column;justify-content:center;padding:6px 0;min-width:0}
.irow{display:flex;align-items:center;gap:10px;padding:0 16px;height:44px;min-width:0}
.irow + .irow{border-top:1px solid var(--border)}
.kind{font-family:var(--font-mono);font-size:10px;color:var(--text-ghost);width:96px;flex:none}
.cnt{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);background:var(--surface);border:1px solid var(--border);
  border-radius:999px;padding:0 7px;line-height:15px;flex:none}
.ititle{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-dim)}
.age{font-family:var(--font-mono);font-size:11px;color:var(--text-ghost);flex:none}
.cardcol{border-left:1px solid var(--border);padding:12px;display:flex}
.dcard{flex:1;display:flex;flex-direction:column;gap:9px;border:1px solid rgba(248,113,113,.32);
  background:rgba(69,10,10,.16);border-radius:6px;padding:12px 14px;min-width:0}
.dcard .top{display:flex;align-items:center;gap:10px}
.dcard .ttl{font-size:13px;color:var(--text)}
.cmd{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border);border-radius:4px;
  padding:7px 10px;min-width:0}
.cmd code{font-family:var(--font-mono);font-size:11.5px;color:var(--text-dim);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;flex:1}
.cmd button{all:unset;cursor:pointer;color:var(--text-faint);font-size:13px;line-height:1;padding:2px 4px;border-radius:3px}
.cmd button:hover{color:var(--text);background:var(--surface)}
.empty{display:flex;align-items:center;justify-content:center;color:var(--text-ghost);grid-column:1/-1}

/* map */
#maprow{display:flex;height:55vh;min-height:430px}
#mapwrap{flex:1;position:relative;min-width:0}
#map{width:100%;height:100%;display:block}
.pklabel{font-size:10px;letter-spacing:.18em;text-transform:uppercase;fill:var(--text-ghost)}
.slabel{font-size:10px;fill:var(--text-dim)}
.alabel{font-family:var(--font-mono);font-size:10px;fill:var(--text-dim)}
.ahint{font-size:8.5px;fill:var(--text-ghost)}
.pulse{animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{stroke-opacity:.16}50%{stroke-opacity:.75}}
@media (prefers-reduced-motion: reduce){.pulse{animation:none;stroke-opacity:.5}}
#hover{position:absolute;display:none;pointer-events:none;z-index:5;background:var(--surface);
  border:1px solid var(--border-2);border-radius:6px;padding:8px 10px;font-size:11px;min-width:160px;
  box-shadow:0 10px 28px rgba(0,0,0,.55)}
#hover .hn{font-family:var(--font-mono);font-size:12px;color:var(--text)}
#hover .hs{color:var(--text-faint);margin-top:2px}
#hover .hr{display:flex;gap:8px;margin-top:3px;color:var(--text-dim);font-family:var(--font-mono);font-size:10.5px;align-items:center}

/* side panel */
#panel{width:300px;flex:none;border-left:1px solid var(--border);padding:14px 14px 10px;display:flex;
  flex-direction:column;gap:9px;overflow:auto}
.phead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.phead .nm{font-family:var(--font-mono);font-size:14px;color:var(--text)}
.chip{font-size:10px;font-family:var(--font-mono);padding:1px 8px;border-radius:999px;border:1px solid var(--border-2);color:var(--text-faint)}
.chip.rt{border-color:rgba(16,185,129,.5);color:var(--ok)}
.chip.drift{border-color:rgba(251,191,36,.5);color:var(--warn);background:var(--warn-bg)}
.psec{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-faint);margin-top:4px;
  display:flex;align-items:center;gap:8px}
.prow{display:flex;align-items:center;gap:8px;height:26px}
.prow .pid{font-family:var(--font-mono);font-size:11px;color:var(--text-dim);width:118px;flex:none;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{flex:1;height:6px;border-radius:3px;background:var(--surface);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.pei{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);flex:none}
.pdiv{border-top:1px solid var(--border);margin:2px -14px 0}
.pill{font-size:10px;font-family:var(--font-mono);padding:1px 8px;border-radius:999px;line-height:15px}
.pill.ok{background:var(--ok-bg);color:var(--ok);border:1px solid rgba(52,211,153,.35)}
.pill.warn{background:var(--warn-bg);color:var(--warn);border:1px solid rgba(251,191,36,.35)}
.note{display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:11px;color:var(--text-dim)}

/* legend (glyphs only — meaning in tooltips) */
#legend{display:flex;align-items:center;gap:14px;height:30px;padding:0 8px}
.lg{display:flex;align-items:center;gap:5px;cursor:help}
.lline{width:22px;height:0;border-top:2px solid var(--text-faint)}
.lline.dash{border-top-style:dashed}
.lball{width:11px;height:11px;border-radius:50%;background:var(--surface);border:1px solid var(--border-2);position:relative}
.lball.drift{box-shadow:0 0 0 2.5px rgba(251,191,36,.55)}
.lball.heal{box-shadow:0 0 0 2.5px rgba(52,211,153,.45),0 0 9px 2px rgba(52,211,153,.35)}
.lball.fresh{border:1px dashed rgba(255,255,255,.7)}
.lball.ref{opacity:.4}
.lball.rt::after{content:"";position:absolute;inset:2.5px;border-radius:50%;border:1.5px solid var(--accent)}
.lball.faded{opacity:.35;border-style:dashed}

/* below-fold bands */
.strip{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ls{display:flex;align-items:center;gap:9px;border:1px solid var(--border);background:var(--surface-2);
  border-radius:6px;padding:7px 13px}
.ls .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint)}
.ls .v{font-family:var(--font-mono);font-size:12.5px;color:var(--text)}
.ls .v.ok{color:var(--ok)} .ls .v.bad{color:var(--bad)} .ls .v.warn{color:var(--warn)} .ls .v.dim{color:var(--text-dim)}
.arrow{color:var(--text-ghost)}
.row{display:flex;align-items:center;gap:11px;height:34px;padding:0 14px;min-width:0}
.row + .row{border-top:1px solid var(--border)}
.rid{font-family:var(--font-mono);font-size:11px;color:var(--text);width:128px;flex:none}
.rtxt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-dim)}
.rmono{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);flex:none}
.kchip{font-family:var(--font-mono);font-size:10px;width:74px;flex:none}
.aid{display:flex;align-items:center;gap:6px;width:150px;flex:none;font-family:var(--font-mono);font-size:11px;color:var(--text-dim)}
.row.flag{background:rgba(248,113,113,.06);box-shadow:inset 2px 0 0 var(--bad)}
.nbadge{font-family:var(--font-mono);font-size:10px;color:var(--warn);background:var(--warn-bg);
  border:1px solid rgba(251,191,36,.3);border-radius:999px;padding:0 7px;line-height:15px;flex:none}
.nzero{font-family:var(--font-mono);font-size:10px;color:var(--text-ghost);flex:none}
footer{margin:20px 2px 6px;font-family:var(--font-mono);font-size:11px;color:var(--text-ghost);display:flex;gap:8px}
</style>
</head>
<body>

<header>
  <div class="brand">brain<span class="sep">·</span><span class="sub">governance</span></div>
  <nav class="views" title="view">
    <span class="v on">Dashboard</span><span class="v link">Map</span>
  </nav>
  <div class="hspace"></div>
  <div class="stepper" id="stepper" title="window: last 7 days (visual only)"></div>
  <div class="asof" id="asof" title="as of"></div>
  <span class="xnav link" title="open the apparatus dashboard">apparatus →</span>
</header>

<main>
  <!-- 1 · status strip -->
  <section class="band" id="status"></section>

  <!-- 2 · needs-you inbox -->
  <section class="band" id="inbox">
    <div class="irows" id="irows"></div>
    <div class="cardcol" id="icard"></div>
  </section>

  <!-- 3 · agent ↔ skill cluster map -->
  <section class="band" id="mapband">
    <div id="maprow">
      <div id="mapwrap">
        <svg id="map" viewBox="0 0 1080 500" preserveAspectRatio="xMidYMid meet"></svg>
        <div id="hover"></div>
      </div>
      <aside id="panel"></aside>
    </div>
  </section>

  <!-- map key: glyphs only, meanings in tooltips -->
  <section id="legend">
    <span class="lg" title="solid edge — explicit attribution (e &gt; 0)"><span class="lline"></span></span>
    <span class="lg" title="dashed edge — inferred only (i &gt; 0, no explicit attribution)"><span class="lline dash"></span></span>
    <span class="lg" title="amber halo — governance drift"><span class="lball drift"></span></span>
    <span class="lg" title="green pulse — healed this window"><span class="lball heal"></span></span>
    <span class="lg" title="dashed white outline — new this window"><span class="lball fresh"></span></span>
    <span class="lg" title="muted — referenced-only, by design"><span class="lball ref"></span></span>
    <span class="lg" title="inner emerald ring — runtime-safe core"><span class="lball rt"></span></span>
    <span class="lg" title="faded agent — no attribution yet"><span class="lball faded"></span></span>
  </section>

  <!-- 4 · below the fold -->
  <section id="loopband">
    <span class="sec">loop</span>
    <div class="strip" id="loopstrip"></div>
  </section>

  <section>
    <span class="sec">contracts</span>
    <div class="band" id="contracts"></div>
  </section>

  <section>
    <span class="sec">timeline</span>
    <div class="band" id="timeline"></div>
  </section>

  <section>
    <span class="sec">rules</span>
    <div class="band" id="rules"></div>
  </section>

  <footer>schema v2 · generated <span id="gen"></span> · <span class="xnav link">apparatus →</span></footer>
</main>

<script>
const DATA = {
  as_of: "2026-06-10", window_days: 7,
  status: { system:"attention", needs_you:{total:19,high:1,med:16,low:2}, drift:2,
            loop:{state:"half-dormant",days:16}, firewall:"intact", freshness_days:0 },
  inbox: [
    {kind:"stale_run",sev:"high",age:"41m",count:1,title:"active_run.json stale — confirm no live process, then remove",cmd:"ls -la run_state/active_run.json"},
    {kind:"gate_verdict",sev:"med",age:"1d",count:14,title:"iter-2026-06-09-008 awaiting gate verdict (+13 older)",cmd:"python -m orchestrator.gate_cli --iteration-id iter-2026-06-09-008 --verdict <valid|invalid|needs_revision> --note '<why>'"},
    {kind:"proposal_review",sev:"med",age:"1d",count:3,title:"P-008 run-log agent attribution — open (+2 more)",cmd:"review memory/brain/proposals.jsonl P-008"},
    {kind:"drift",sev:"low",age:"16d",count:2,title:"experiment misused · run-log friction x3 + diverged x1",cmd:"see memory/conformance.md"}
  ],
  agents: [
    {id:"claude-code-main",hue:"var(--agent-claude)",runs:137},
    {id:"nara",hue:"var(--agent-nara)",runs:111},
    {id:"coordinator",hue:"var(--agent-coordinator)",runs:33},
    {id:"workflow",hue:"var(--agent-workflow)",runs:9},
    {id:"nemoclaw_agent",hue:"var(--agent-nemoclaw)",runs:3},
    {id:"human:decross1",hue:"var(--agent-human)",runs:6}
  ],
  skill_states: {
    drift:["experiment","run-log"],
    healed:["resume-state","slip-ladder"],
    fresh:["narrate","propose","review-proposal","brain-recall","slip-ladder"],
    by_design:["orchestrate","repro-check","plan-research"],
    runtime_safe:["resume-state","gate-check","validate","fallback","run-log","spawn-contract"]
  },
  matrix: [
    {a:"nara",s:"validate",e:6,i:4},{a:"nara",s:"gate-check",e:3,i:2},{a:"nara",s:"fallback",e:2,i:3},
    {a:"nara",s:"run-log",e:3,i:8},{a:"nara",s:"slip-ladder",e:0,i:1},
    {a:"claude-code-main",s:"run-log",e:0,i:20},{a:"claude-code-main",s:"validate",e:0,i:11},
    {a:"claude-code-main",s:"gate-check",e:0,i:6},{a:"claude-code-main",s:"decision-log",e:0,i:9},
    {a:"claude-code-main",s:"harvest",e:0,i:8},{a:"claude-code-main",s:"narrate",e:0,i:9},
    {a:"claude-code-main",s:"propose",e:0,i:10},{a:"claude-code-main",s:"review-proposal",e:0,i:8},
    {a:"claude-code-main",s:"ship",e:0,i:5},{a:"claude-code-main",s:"code-review",e:0,i:4},
    {a:"claude-code-main",s:"investigate",e:0,i:3},
    {a:"coordinator",s:"run-log",e:0,i:33},
    {a:"workflow",s:"validate",e:2,i:0},{a:"workflow",s:"run-log",e:3,i:0},{a:"workflow",s:"spawn-contract",e:0,i:6},
    {a:"human:decross1",s:"gate-check",e:0,i:4},{a:"human:decross1",s:"decision-log",e:0,i:2}
  ],
  loop: {harvest:{n:42,dormant_days:16}, proposals_open:3, review:{ok:6,rej:1,human:0}, enacted:{rules:3,skills:2}},
  contracts: [
    {id:"SP-002",agent:"workflow",check:"pass",budget:"300s",age:"16d"},
    {id:"SP-wf-evening-G",agent:"workflow",check:"freeform",budget:"900s",age:"1d"},
    {id:"SP-wf-evening-D",agent:"workflow",check:"pass",budget:"1800s",age:"1d"}
  ],
  timeline: [
    {d:"06-09",kind:"proposal",id:"P-008",t:"run-log agent attribution in a_bgt_rsi",agent:"claude-code-main"},
    {d:"06-09",kind:"correction",id:"corr-armc",t:"do not launch 2nd large model alongside gemma (48GiB)",agent:"claude-code-main",flag:true},
    {d:"06-09",kind:"decision",id:"D-043",t:"run-log schema: agent required, skill_used optional",agent:"human:decross1"},
    {d:"06-09",kind:"decision",id:"D-042",t:"4 skills intentionally referenced-only",agent:"human:decross1"},
    {d:"06-08",kind:"decision",id:"D-040",t:"unattended Nara autonomy contract (at beta)",agent:"human:decross1"},
    {d:"06-08",kind:"reflection",id:"refl-008",t:"errored eval-worker call is not a measurement",agent:"claude-code-main"}
  ],
  rules: [
    {id:"FR-001",t:"treat 100% metrics in small-N tests as suspicious-clean",n:1},
    {id:"FR-002",t:"reconcile state-file lag against run-log during gate-armed periods",n:0},
    {id:"FR-003",t:"run-log schema: agent required + skill_used optional",n:0}
  ]
};

// pack membership — from: grep "^pack:" .agents/skills/&lt;skill&gt;/SKILL.md
const PACKS = {
  core:["resume-state","gate-check","validate","fallback","run-log","spawn-contract","slip-ladder"],
  research:["plan-research","investigate","code-review","health","ship","experiment","auto-experiment","repro-check"],
  meta:["orchestrate","harvest","decision-log","context-save","context-restore"],
  brain:["brain-recall","narrate","propose","review-proposal"]
};

/* hand-tuned layout, viewBox 1080×500 */
const SPOS = {
  "fallback":[392,150],"resume-state":[514,148],"run-log":[436,234],"validate":[336,300],
  "gate-check":[484,312],"spawn-contract":[566,252],"slip-ladder":[352,356],
  "experiment":[740,92],"code-review":[842,66],"investigate":[940,90],"plan-research":[748,172],
  "ship":[848,146],"health":[958,162],"repro-check":[818,224],"auto-experiment":[922,234],
  "narrate":[906,322],"propose":[998,310],"brain-recall":[914,398],"review-proposal":[1002,386],
  "decision-log":[660,356],"harvest":[744,326],"orchestrate":[704,412],"context-save":[618,404],"context-restore":[788,400]
};
const APOS = {
  "claude-code-main":[296,84],"nara":[116,246],"coordinator":[138,398],
  "workflow":[412,446],"human:decross1":[640,464],"nemoclaw_agent":[84,60]
};

const HUE = Object.fromEntries(DATA.agents.map(a=>[a.id,a.hue]));
const ST  = Object.fromEntries(Object.entries(DATA.skill_states).map(([k,v])=>[k,new Set(v)]));
const SEVC = {high:"var(--bad)",med:"var(--warn)",low:"var(--idle)"};
const aR = runs => 7 + 1.7*Math.sqrt(runs);

const $  = id => document.getElementById(id);
const H  = (tag,cls,parent,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;
  if(txt!=null)e.textContent=txt;if(parent)parent.appendChild(e);return e;};
const S  = (tag,at,parent)=>{const e=document.createElementNS("http://www.w3.org/2000/svg",tag);
  for(const k in at)e.setAttribute(k,at[k]);if(parent)parent.appendChild(e);return e;};
const sT = (el,txt)=>{const t=S("title",{},el);t.textContent=txt;};

/* ---------- header ---------- */
(function(){
  const st=$("stepper");
  for(let d=1;d<=7;d++){
    const t=H("span", d===DATA.window_days?"tick on":(d<DATA.window_days?"tick fill":"tick"), st);
    if(d===1||d===7) t.textContent=d;
  }
  $("asof").textContent=DATA.as_of;
  $("gen").textContent=DATA.as_of;
})();

/* ---------- status strip ---------- */
(function(){
  const s=DATA.status, host=$("status");
  const seg=(title)=>{const e=H("div","seg",host);e.title=title;return e;};

  let e=seg("system: needs attention");
  H("span","dot",e).style.background="var(--warn)";
  H("span","v warn",e,s.system);

  e=seg(`${s.needs_you.high} high · ${s.needs_you.med} med · ${s.needs_you.low} low`);
  H("span","k",e,"needs you");
  H("span","v",e,String(s.needs_you.total));
  const tv=H("span","ticksv",e);
  [["high",10],["med",7],["low",4]].forEach(([sv,h])=>{const i=H("i","",tv);i.style.height=h+"px";i.style.background=SEVC[sv];});

/* ---------- cluster map ---------- */
(function(){
  const svg=$("map");
  const gHull=S("g",{},svg), gEdge=S("g",{},svg), gSkill=S("g",{},svg), gAgent=S("g",{},svg);

  /* soft convex hull per pack */
  const hull=pts=>{
    const p=[...pts].sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
    const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);
    const lo=[],up=[];
    for(const q of p){while(lo.length>1&&cr(lo[lo.length-2],lo[lo.length-1],q)<=0)lo.pop();lo.push(q);}
    for(const q of [...p].reverse()){while(up.length>1&&cr(up[up.length-2],up[up.length-1],q)<=0)up.pop();up.push(q);}
    return lo.slice(0,-1).concat(up.slice(0,-1));
  };
  for(const pk in PACKS){
    const pts=PACKS[pk].map(s=>SPOS[s]);
    const cx=pts.reduce((s,p)=>s+p[0],0)/pts.length, cy=pts.reduce((s,p)=>s+p[1],0)/pts.length;
    const hv=hull(pts).map(([x,y])=>{const dx=x-cx,dy=y-cy,d=Math.hypot(dx,dy)||1;
      return [x+dx/d*30, y+dy/d*30];});
    const n=hv.length, mid=(a,b)=>`${(a[0]+b[0])/2} ${(a[1]+b[1])/2}`;
    let d=`M ${mid(hv[0],hv[1])}`;
    for(let i=1;i<=n;i++){const v=hv[i%n];d+=` Q ${v[0]} ${v[1]} ${mid(v,hv[(i+1)%n])}`;}
    const path=S("path",{d:d+" Z",fill:"var(--surface)","fill-opacity":".55",
      stroke:"var(--border)","stroke-opacity":".8"},gHull);
    sT(path,`pack: ${pk}`);
    const minY=Math.min(...pts.map(p=>p[1]));
    S("text",{x:cx,y:minY-16,"text-anchor":"middle",class:"pklabel"},gHull).textContent=pk;
  }

  /* edges — solid e>0, dashed inferred-only; width 1+2√(e+i) */
  DATA.matrix.forEach(m=>{
    const a=APOS[m.a], s=SPOS[m.s], r=aR(DATA.agents.find(x=>x.id===m.a).runs);
    const dx=s[0]-a[0], dy=s[1]-a[1], d=Math.hypot(dx,dy);
    const ux=dx/d, uy=dy/d;
    const x1=a[0]+ux*(r+5), y1=a[1]+uy*(r+5), x2=s[0]-ux*17, y2=s[1]-uy*17;
    const k=0.07*d, mx=(x1+x2)/2+dy/d*k, my=(y1+y2)/2-dx/d*k;
    const w=1+2*Math.sqrt(m.e+m.i);
    const at={d:`M ${x1} ${y1} Q ${mx} ${my} ${x2} ${y2}`,fill:"none",
      stroke:HUE[m.a],"stroke-opacity":".55","stroke-width":w.toFixed(1),"stroke-linecap":"round"};
    if(m.e===0) at["stroke-dasharray"]=`${(2+w).toFixed(1)} ${(3.5+w).toFixed(1)}`;
    sT(S("path",at,gEdge),`${m.a} → ${m.s} · e${m.e} i${m.i}${m.e?" · explicit":" · inferred only"}`);
  });

  /* skill nodes */
  const skillUsage=s=>DATA.matrix.filter(m=>m.s===s);
  const stateWords=s=>{const w=[];
    if(ST.drift.has(s))w.push("drift");if(ST.healed.has(s))w.push("healed");
    if(ST.fresh.has(s))w.push("new");if(ST.by_design.has(s))w.push("ref-only by design");
    if(ST.runtime_safe.has(s))w.push("runtime-safe");return w;};

  for(const pk in PACKS) PACKS[pk].forEach(sk=>{
    const [x,y]=SPOS[sk];
    const g=S("g",{transform:`translate(${x},${y})`,"data-n":sk},gSkill);
    if(ST.by_design.has(sk)) g.setAttribute("opacity",".4");
    if(sk==="run-log") S("circle",{r:17,fill:"none",stroke:"var(--text-dim)","stroke-opacity":".5","stroke-width":1},g);
    if(ST.drift.has(sk)){
      S("circle",{r:15,fill:"none",stroke:"var(--warn)","stroke-width":4,"stroke-opacity":".12"},g);
      S("circle",{r:11.5,fill:"none",stroke:"var(--warn)","stroke-width":1.3,"stroke-opacity":".85"},g);
    }
    if(ST.healed.has(sk)){
      S("circle",{r:16,fill:"none",stroke:"var(--ok)","stroke-width":5,"stroke-opacity":".08"},g);
      S("circle",{r:12.5,fill:"none",stroke:"var(--ok)","stroke-width":1.3,class:"pulse"},g);
    }
    if(ST.fresh.has(sk))
      S("circle",{r:9.5,fill:"none",stroke:"#fff","stroke-width":1,"stroke-opacity":".65","stroke-dasharray":"2.5 3"},g);
    S("circle",{r:7,fill:"var(--surface)",stroke:"var(--border-2)","stroke-width":1.2},g);
    if(ST.runtime_safe.has(sk))
      S("circle",{r:3.2,fill:"none",stroke:"var(--accent)","stroke-width":1.3,"stroke-opacity":".95"},g);
    if(ST.by_design.has(sk))
      S("rect",{x:8,y:-13,width:5,height:5,fill:"none",stroke:"var(--text-ghost)","stroke-dasharray":"1.6 1.6"},g);
    S("text",{y:19,"text-anchor":"middle",class:"slabel"},g).textContent=sk;
    const u=skillUsage(sk), te=u.reduce((s,m)=>s+m.e,0), ti=u.reduce((s,m)=>s+m.i,0);
    sT(g,`${sk} · pack ${pk}${stateWords(sk).length?" · "+stateWords(sk).join(", "):""} · e${te} i${ti}`);
    hoverable(g,()=>hoverSkill(sk,pk));
  });

  /* agent nodes */
  DATA.agents.forEach(a=>{
    const [x,y]=APOS[a.id], r=aR(a.runs);
    const g=S("g",{transform:`translate(${x},${y})`,"data-n":a.id},gAgent);
    const zero=!DATA.matrix.some(m=>m.a===a.id);
    if(zero) g.setAttribute("opacity",".45");
    const shape = a.id==="human:decross1"
      ? S("rect",{x:-r*.78,y:-r*.78,width:r*1.56,height:r*1.56,rx:2,transform:"rotate(45)"},g)
      : S("circle",{r:r},g);
    shape.setAttribute("fill",a.hue); shape.setAttribute("fill-opacity",".13");
    shape.setAttribute("stroke",a.hue); shape.setAttribute("stroke-width","1.6");
    if(zero) shape.setAttribute("stroke-dasharray","3 3");
    S("text",{y:r+14,"text-anchor":"middle",class:"alabel"},g).textContent=a.id;
    if(zero) S("text",{y:r+26,"text-anchor":"middle",class:"ahint"},g).textContent="awaiting attribution";
    sT(g,`${a.id} · ${a.runs} runs / ${DATA.window_days}d${zero?" · no attribution yet":""}`);
    hoverable(g,()=>hoverAgent(a));
  });

  /* hover card */
  const hov=$("hover"), wrap=$("mapwrap");
  function hoverable(g,fill){
    g.addEventListener("mouseenter",()=>{hov.innerHTML=fill();hov.style.display="block";});
    g.addEventListener("mousemove",ev=>{
      const b=wrap.getBoundingClientRect();
      let hx=ev.clientX-b.left+14, hy=ev.clientY-b.top+12;
      if(hx+180>b.width) hx-=200; if(hy+90>b.height) hy-=100;
      hov.style.left=hx+"px"; hov.style.top=hy+"px";
    });
    g.addEventListener("mouseleave",()=>hov.style.display="none");
  }
  function hoverSkill(sk,pk){
    const rows=DATA.matrix.filter(m=>m.s===sk)
      .map(m=>`<div class="hr"><span class="dot" style="background:${HUE[m.a]};width:6px;height:6px"></span>${m.a} · e${m.e} i${m.i}</div>`).join("");
    return `<div class="hn">${sk}</div><div class="hs">${pk}${stateWords(sk).length?" · "+stateWords(sk).join(" · "):""}</div>${rows||'<div class="hs">no usage in window</div>'}`;
  }
  function hoverAgent(a){
    const rows=DATA.matrix.filter(m=>m.a===a.id).sort((x,y)=>(y.e+y.i)-(x.e+x.i)).slice(0,4)
      .map(m=>`<div class="hr">${m.s} · e${m.e} i${m.i}</div>`).join("");
    return `<div class="hn">${a.id}</div><div class="hs">${a.runs} runs / ${DATA.window_days}d</div>${rows||'<div class="hs">awaiting attribution</div>'}`;
  }
})();
