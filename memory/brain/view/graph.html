<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>brain · map</title>
<link rel="stylesheet" href="tokens.css">
<style>
html{color-scheme:dark;height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.45 system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  height:100vh;display:flex;flex-direction:column;overflow:hidden}
.mono{font-family:var(--font-mono)}
a{color:var(--text-dim);text-decoration:none;cursor:pointer}
a:hover{color:var(--text)}

/* header — same idiom as dashboard.html */
header{display:flex;align-items:center;gap:16px;height:56px;padding:0 18px;border-bottom:1px solid var(--border);flex:none}
.brand{font-weight:600;letter-spacing:.02em;white-space:nowrap}
.brand .sep{color:var(--text-ghost);font-weight:400;margin:0 4px}
.brand .sub{color:var(--text-faint);font-weight:500}
nav.views{display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:2px}
nav.views .v{padding:3px 11px;border-radius:4px;color:var(--text-faint);font-size:12px}
nav.views .v.on{background:#27272a;color:var(--text)}
.hspace{flex:1}
.stepper{display:flex;gap:3px;align-items:center}
.tick{appearance:none;width:15px;height:15px;border:1px solid var(--border);border-radius:3px;display:grid;place-items:center;
  font-size:9px;color:var(--text-ghost);font-family:var(--font-mono);background:var(--surface-2);padding:0;cursor:pointer}
.tick.fill{background:#1b2a24;border-color:#1f3d33}
.tick.on{background:var(--ok-bg);border-color:var(--accent);color:var(--ok)}
.asof{font-family:var(--font-mono);color:var(--text-faint);font-size:12px}
.xnav{font-size:12px;white-space:nowrap}

/* full-canvas map */
#mapwrap{flex:1;position:relative;min-height:0}
#map{display:block;width:100%;height:100%}
#mapnote{position:absolute;inset:0;display:grid;place-items:center;color:var(--text-ghost);
  font-family:var(--font-mono);font-size:11px;pointer-events:none}
#mapnote[hidden]{display:none}

/* legend — glyphs only, meanings in tooltips (SPEC §10) */
#legend{display:flex;align-items:center;gap:14px;height:30px;padding:0 18px;border-top:1px solid var(--border);flex:none}
.lg{display:flex;align-items:center;gap:5px;cursor:help}
.lline{width:22px;height:0;border-top:2px solid var(--text-faint)}
.lline.dash{border-top-style:dashed}
.lball{width:11px;height:11px;border-radius:50%;background:var(--surface);border:1px solid var(--border-2);position:relative}
.lball.fw{box-shadow:0 0 0 2.5px rgba(248,113,113,.55)}
.lball.drift{box-shadow:0 0 0 2.5px rgba(251,191,36,.55)}
.lball.heal{box-shadow:0 0 0 2.5px rgba(52,211,153,.45),0 0 9px 2px rgba(52,211,153,.35)}
.lball.fresh{border:1px dashed rgba(255,255,255,.7)}
.lball.ref{opacity:.4}
.lball.dim{opacity:.55;border-style:dotted}
.lball.rt::after{content:"";position:absolute;inset:2.5px;border-radius:50%;border:1.5px solid var(--accent)}
</style>
</head>
<body>

<header>
  <div class="brand">brain<span class="sep">·</span><span class="sub">governance</span></div>
  <nav class="views" title="view">
    <a class="v" href="dashboard.html">Dashboard</a><a class="v on" href="graph.html">Map</a>
  </nav>
  <div class="hspace"></div>
  <div class="stepper" id="stepper"></div>
  <div class="asof" id="asof"></div>
  <a class="xnav" id="apparatus" title="open the apparatus dashboard">apparatus →</a>
</header>

<div id="mapwrap">
  <canvas id="map"></canvas>
  <div id="mapnote" hidden>map data not generated — scripts/project_map.py</div>
</div>

<section id="legend">
  <span class="lg" title="solid edge — explicit attribution (e &gt; 0)"><span class="lline"></span></span>
  <span class="lg" title="dashed edge — inferred only (i &gt; 0, no explicit attribution)"><span class="lline dash"></span></span>
  <span class="lg" title="skill, no governance signal"><span class="lball"></span></span>
  <span class="lg" title="red halo — runtime-safe firewall violation"><span class="lball fw"></span></span>
  <span class="lg" title="amber halo — governance drift"><span class="lball drift"></span></span>
  <span class="lg" title="green pulse — healed this window"><span class="lball heal"></span></span>
  <span class="lg" title="dashed white outline — new this window"><span class="lball fresh"></span></span>
  <span class="lg" title="muted + tag — referenced-only, by design (D-042)"><span class="lball ref"></span></span>
  <span class="lg" title="dim — untested by any consumer trace"><span class="lball dim"></span></span>
  <span class="lg" title="inner emerald ring — runtime-safe core"><span class="lball rt"></span></span>
</section>

<script src="summary_data.js"></script>
<script src="map_data.js"></script>
<script src="ui.js"></script>
<script src="map.js"></script>
<script>
(function () {
"use strict";
// degrade gracefully when ui.js is absent at dev time: minimal esc/kv/panel shim
const U = window.UI || (function () {
  const esc = s => String(s == null ? "" : s)
    .replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  let el = null;
  function open(title, html) {
    if (!el) {
      el = document.createElement("aside");
      el.style.cssText = "position:fixed;top:0;right:0;bottom:0;width:380px;z-index:40;overflow:auto;" +
        "background:var(--bg);border-left:1px solid var(--border-2);padding:12px 14px;font-size:12px";
      document.body.appendChild(el);
      document.addEventListener("keydown", e => { if (e.key === "Escape") close(); });
    }
    el.innerHTML = '<div style="display:flex;gap:10px;align-items:center"><b class="mono" style="flex:1">' +
      esc(title) + '</b><button id="ui-shim-x" style="all:unset;cursor:pointer;color:var(--text-faint)">✕</button></div>' + html;
    el.style.display = "block";
    el.querySelector("#ui-shim-x").addEventListener("click", close);
  }
  function close() { if (el) el.style.display = "none"; }
  return { esc, agentHue: () => "var(--agent-other)",
    kv: (k, v) => '<div class="ui-kv" style="display:flex;gap:10px"><span style="color:var(--text-faint);width:98px;flex:none">' +
      esc(k) + '</span><span class="mono">' + v + "</span></div>",
    panel: { open, close, isOpen: () => false } };
})();
const esc = U.esc;
const D = window.BRAIN_SUMMARY || null;
const M = window.BRAIN_MAP || null;
const $ = id => document.getElementById(id);
$("mapnote").hidden = !!M;

const WIN_MIN = (D && D.window && D.window.min_days) || 1;
const WIN_MAX = (D && D.window && D.window.max_days) || 7;
const asof = ((D && D.window && D.window.newest_event) ||
  (M && M.generated_at) || "").slice(0, 10);
$("asof").textContent = asof;
$("asof").title = "as of " + asof;
$("apparatus").href = "http://" + (location.hostname || "localhost") + ":5173";

/* ---------- window stepper (shared brain.windowDays key; ←/→ steps) ---------- */
let windowDays = (D && D.window && D.window.default_days) || 7;
try {
  const s = parseInt(localStorage.getItem("brain.windowDays"), 10);
  if (s >= WIN_MIN && s <= WIN_MAX) windowDays = s;
} catch (_) {}
function renderStepper() {
  const st = $("stepper");
  st.innerHTML = "";
  st.title = "window: last " + windowDays + " day" + (windowDays === 1 ? "" : "s") + " · ←/→ to step";
  for (let d = WIN_MIN; d <= WIN_MAX; d++) {
    const t = document.createElement("button");
    t.className = d === windowDays ? "tick on" : d < windowDays ? "tick fill" : "tick";
    if (d === WIN_MIN || d === WIN_MAX) t.textContent = d;
    t.addEventListener("click", () => setWindow(d));
    st.appendChild(t);
  }
}
function setWindow(n) {
  if (n === windowDays || n < WIN_MIN || n > WIN_MAX) return;
  windowDays = n;
  try { localStorage.setItem("brain.windowDays", String(n)); } catch (_) {}
  renderStepper();
  mountMap();
}
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
  if (e.key === "ArrowLeft") setWindow(windowDays - 1);
  if (e.key === "ArrowRight") setWindow(windowDays + 1);
});

/* ---------- full-viewport BrainMap ---------- */
let inst = null, demoShown = false;
function mountMap() {
  if (!M || typeof window.BrainMap === "undefined") return;
  inst = BrainMap.mount($("map"), {
    summary: D, map: M, windowDays: windowDays, embedded: false, onSelect: openNode
  });
  if (!demoShown) { demoShown = true; inst.demoCard(); }  // SPEC §7 affordance demo
}

/* ---------- side panel: governance detail + view-lineage ---------- */
const dayDiff = d => Math.round((Date.parse(asof) - Date.parse(String(d).slice(0, 10))) / 864e5);
const inWin = d => { if (!d) return false; const x = dayDiff(d); return x >= 0 && x < windowDays; };
function sliceCell(c) {
  if (!c.by_day) return { e: c.explicit || 0, i: c.inferred || 0 };
  let e = 0, i = 0;
  for (const d in c.by_day) if (inWin(d)) { e += c.by_day[d].e || 0; i += c.by_day[d].i || 0; }
  return { e, i };
}
const hueOf = id => (window.UI ? window.UI.agentHue(id) : "var(--agent-other)");
const usageLegend = '<span class="ui-dot" style="width:6px;height:6px;background:var(--text-dim)" title="solid = explicit"></span>' +
  '<span class="ui-dot" style="width:6px;height:6px;background:none;border:1px solid var(--text-dim)" title="faded = inferred"></span>';

function usageRows(filterKey, filterVal) {
  const rows = (((D || {}).matrix || {}).cells || [])
    .filter(c => c[filterKey] === filterVal)
    .map(c => ({ c, w: sliceCell(c) }))
    .filter(x => x.w.e + x.w.i > 0)
    .sort((a, b) => (b.w.e + b.w.i) - (a.w.e + a.w.i));
  if (!rows.length) return '<div class="ui-note">no usage in window</div>';
  const mx = Math.max(...rows.map(x => x.w.e + x.w.i));
  return rows.map(x => {
    const other = filterKey === "skill" ? x.c.agent : x.c.skill;
    const hue = filterKey === "skill" ? hueOf(x.c.agent) : hueOf(filterVal);
    return '<div class="ui-row" title="' + esc(other) + ": " + x.w.e + " explicit · " + x.w.i + ' inferred">' +
      '<span class="ui-dot" style="background:' + hue + '"></span>' +
      '<span class="ui-id">' + esc(other) + '</span>' +
      '<span class="ui-bar">' +
      (x.w.e ? '<i style="width:' + (x.w.e / mx * 100).toFixed(1) + "%;background:" + hue + '"></i>' : "") +
      (x.w.i ? '<i style="width:' + (x.w.i / mx * 100).toFixed(1) + "%;background:" + hue + ';opacity:.32"></i>' : "") +
      '</span><span class="ui-num">e' + x.w.e + "·i" + x.w.i + "</span></div>";
  }).join("");
}
const lineageBtn = id =>
  '<div class="ui-row" style="margin-top:8px"><button data-lineage="' + esc(id) +
  '" style="all:unset;cursor:pointer;font:11px var(--font-mono);color:var(--text-dim);' +
  'border:1px solid var(--border-2);border-radius:5px;padding:4px 10px">view lineage ⌖</button></div>';
const cardBlock = id => {
  const c = (M && M.cards && M.cards[id]) || null;
  if (!c) return "";
  return (c.one_line ? '<div class="ui-note">' + esc(c.one_line) + "</div>" : "") +
    (c.date ? U.kv("date", esc(c.date)) : "") +
    (c.source ? U.kv("source", esc(c.source)) : "") +
    (c.page ? '<div class="ui-row" style="min-height:20px"><a class="ui-num" href="' + esc(c.page) + '">' +
      esc(c.page.replace("../pages/", "pages/")) + "</a></div>" : "");
};

function openSkill(node) {
  const name = node.label;
  const s = ((D || {}).skills || []).find(x => x.name === name) || null;
  const g = (s && s.governance) || {};
  let chips = '<span class="ui-chip">' + esc(node.pack || (s && s.pack) || "?") + "</span>";
  if (s && s.runtime_safe) chips += '<span class="ui-chip rt" title="member of the 6-skill runtime-safe core">runtime-safe</span>';
  if (g.firewall_violation) chips += '<span class="ui-chip warn">firewall</span>';
  if (g.drift && g.drift.active) chips += '<span class="ui-chip warn">drift</span>';
  let html = '<div class="ui-row" style="flex-wrap:wrap">' + chips + "</div>" +
    (s ? '<div class="ui-note">' + esc(s.purpose || "") + "</div>" : cardBlock(node.id));

  html += '<div class="ui-sec" title="' + esc(((D || {}).matrix || {}).method_note || "") + '">usage ' +
    usageLegend + "</div>" + usageRows("skill", name);

  // governance detail: drift findings (D-042 referenced-only dispositions),
  // heal chain, conformance verdict
  html += '<div class="ui-div"></div><div class="ui-sec">governance</div>';
  if (g.referenced_only_by_design) {
    html += '<div class="ui-note" title="a_bgt_rsi D-042: four skills are intentionally referenced-only in the consumer">' +
      "referenced-only by design (D-042) — drift findings carry this disposition</div>";
  }
  if (g.drift) {
    const cls = g.drift.classes || {};
    const parts = Object.keys(cls).sort().map(k => k + " ×" + cls[k]).join(" · ");
    html += '<div class="ui-note" style="color:var(--warn)">▲ ' + esc(parts || "misuse") +
      (g.drift.latest ? " · latest " + esc(g.drift.latest) : "") + "</div>";
    if (g.drift.open_note) html += '<div class="ui-note">' + esc(g.drift.open_note) + "</div>";
  }
  if (g.healed && (g.healed.proposal_id || g.healed.rule_id)) {
    html += U.kv("heal chain", esc([g.healed.proposal_id, g.healed.rule_id].filter(Boolean).join(" → ")) +
      (g.healed.accepted_at ? " · " + esc(g.healed.accepted_at) : ""));
  }
  if (g.new) html += U.kv("born", esc(g.new.born || "") + " · " + esc(g.new.via || ""));
  if (g.conformance && g.conformance.status) {
    html += '<div class="ui-note" title="memory/conformance.md">verdict: ' + esc(g.conformance.status) + "</div>";
  } else if (!s) {
    html += '<div class="ui-note">summary_data.js absent — governance detail unavailable</div>';
  }
  html += lineageBtn(node.id);
  U.panel.open(name, html);
}

function openAgent(node) {
  const id = node.label;
  const a = ((D || {}).agents || []).find(x => x.id === id) || null;
  let runs = 0;
  if (a) for (const d in (a.runs_by_day || {})) if (inWin(d)) runs += a.runs_by_day[d];
  let html = '<div class="ui-row"><span class="ui-dot" style="background:' + hueOf(id) + '"></span>' +
    (a ? '<span class="ui-chip">' + esc(a.kind) + '</span><span class="ui-chip" title="attribution evidence quality">' +
      esc(a.evidence) + "</span>" : "") + "</div>" +
    U.kv("runs / " + windowDays + "d", String(runs)) +
    (a ? U.kv("first seen", esc(a.first_seen || "—")) + U.kv("last seen", esc(a.last_seen || "—")) : cardBlock(node.id)) +
    '<div class="ui-sec">skills ' + usageLegend + "</div>" + usageRows("agent", id) +
    lineageBtn(node.id);
  U.panel.open(id, html);
}

function openOther(node) {
  const c = (M && M.cards && M.cards[node.id]) || {};
  const html = '<div class="ui-row"><span class="ui-chip">' + esc(node.type) + "</span></div>" +
    (c.title ? '<div class="ui-title">' + esc(c.title) + "</div>" : "") +
    cardBlock(node.id) + lineageBtn(node.id);
  U.panel.open(node.label || node.id, html);
}

function openNode(node) {
  if (!node) return;
  if (node.type === "skill") return openSkill(node);
  if (node.type === "agent") return openAgent(node);
  return openOther(node);
}
document.addEventListener("click", e => {
  const b = e.target.closest && e.target.closest("[data-lineage]");
  if (b && inst) inst.egoMode(b.getAttribute("data-lineage"));
});

/* ---------- init ---------- */
renderStepper();
mountMap();
})();
</script>
</body>
</html>
