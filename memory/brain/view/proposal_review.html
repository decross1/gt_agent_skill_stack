<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>brain · proposal review</title>
<style>
/* ---- palette: the brain's dark operational surface ---- */
:root {
  --bg:#09090b; --surface:#18181b; --surface-2:rgba(24,24,27,.4);
  --border:#27272a; --border-2:#3f3f46;
  --text:#e4e4e7; --text-dim:#a1a1aa; --text-faint:#71717a; --text-ghost:#52525b;
  --accent:#10b981; --ok:#34d399; --warn:#fbbf24; --bad:#f87171; --idle:#38bdf8;
  --ok-bg:#022c22; --warn-bg:#451a03; --bad-bg:#450a0a;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --pro:#34d399; --con:#f87171;
}
* { box-sizing:border-box; }
html { color-scheme:dark; }
body { margin:0; background:var(--bg); color:var(--text);
  font:13px/1.5 system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
.mono { font-family:var(--font-mono); }
button { font:inherit; color:inherit; }

/* header */
header { display:flex; align-items:center; gap:16px; height:56px; padding:0 18px;
  border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--bg); z-index:5; }
.brand { font-weight:600; letter-spacing:.02em; white-space:nowrap; }
.brand .sep { color:var(--text-ghost); font-weight:400; margin:0 4px; }
.brand .sub { color:var(--text-faint); font-weight:500; }
nav.views { display:flex; gap:2px; background:var(--surface-2); border:1px solid var(--border);
  border-radius:6px; padding:2px; }
nav.views a { padding:3px 11px; border-radius:4px; color:var(--text-faint); font-size:12px;
  text-decoration:none; }
nav.views a:hover { color:var(--text); }
nav.views a.on { background:var(--border); color:var(--text); }
.hspace { flex:1; }
.gerr { font-family:var(--font-mono); font-size:12px; color:var(--bad); }

/* layout: list + detail */
main { display:grid; grid-template-columns:320px 1fr; min-height:calc(100vh - 56px); }
@media (max-width:760px) { main { grid-template-columns:1fr; } }

/* list */
#list { border-right:1px solid var(--border); overflow-y:auto; min-width:0; }
.sec { display:block; font-size:11px; text-transform:uppercase; letter-spacing:.08em;
  color:var(--text-faint); padding:12px 14px 6px; }
.list-tools { padding:10px 12px; border-bottom:1px solid var(--border); }
.list-tools label { display:block; font-size:10px; color:var(--text-faint); text-transform:uppercase;
  letter-spacing:.08em; }
.list-tools input { width:100%; margin-top:6px; border:1px solid var(--border-2); border-radius:6px;
  padding:8px 9px; background:var(--surface); color:var(--text); font:12px var(--font-mono); }
.list-tools input:focus { outline:2px solid var(--accent); outline-offset:1px; }
.catalog-counts { margin-top:7px; color:var(--text-faint); font:10.5px var(--font-mono); }
.list-group { border-bottom:1px solid var(--border); }
.group-head { display:flex; justify-content:space-between; gap:8px; padding:10px 14px 6px;
  color:var(--text-faint); font-size:10px; text-transform:uppercase; letter-spacing:.08em; }
.group-head b { color:var(--text-dim); font-family:var(--font-mono); }
.pitem { display:flex; width:100%; text-align:left; flex-direction:column; gap:4px;
  padding:10px 14px; cursor:pointer; border:0; border-top:1px solid var(--border);
  background:transparent; }
.pitem:hover { background:var(--surface-2); }
.pitem:focus-visible { outline:2px solid var(--accent); outline-offset:-2px; }
.pitem.on { background:var(--surface-2); box-shadow:inset 2px 0 0 var(--accent); }
.pitem .pid { font-family:var(--font-mono); font-size:11px; color:var(--text-faint); }
.pitem .ptitle { color:var(--text); font-size:12.5px; }
.pitem .pmeta { display:flex; align-items:center; gap:7px; }
.chip { display:inline-block; font-family:var(--font-mono); font-size:10px; padding:1px 7px;
  border-radius:999px; border:1px solid var(--border-2); color:var(--text-dim);
  background:var(--surface-2); white-space:nowrap; }
.chip.verdict { color:var(--warn); border-color:var(--warn); }
.chip.verdict.accept { color:var(--ok); border-color:var(--ok); }
.chip.verdict.reject { color:var(--bad); border-color:var(--bad); }
.chip.candidate { color:var(--warn); border-color:var(--warn); }
.chip.history { color:var(--text-faint); }
.muted { color:var(--text-ghost); }

/* detail */
#detail { overflow-y:auto; padding:18px 22px 60px; }
.placeholder { display:grid; place-items:center; height:60vh; color:var(--text-ghost);
  font-family:var(--font-mono); font-size:12px; }
.dhead { display:flex; align-items:flex-start; gap:12px; flex-wrap:wrap; }
.dhead h1 { font-size:18px; margin:0; font-weight:600; flex:1; min-width:200px; }

/* three labelled zones */
.zone { margin-top:20px; border:1px solid var(--border); border-radius:10px; overflow:hidden;
  background:var(--surface-2); }
.zone:first-of-type { margin-top:18px; }
.zone > .zhead { display:flex; align-items:baseline; gap:10px; padding:11px 16px;
  border-bottom:1px solid var(--border); background:var(--surface); }
.zone > .zhead .znum { font-family:var(--font-mono); font-size:11px; color:var(--accent);
  font-weight:600; }
.zone > .zhead .ztitle { font-size:12px; text-transform:uppercase; letter-spacing:.06em;
  color:var(--text); font-weight:600; }
.zone > .zhead .zsub { color:var(--text-faint); font-size:11px; font-style:italic; }
.zbody { padding:16px; }
.block { margin-top:18px; }
.block:first-child { margin-top:0; }
.label { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-faint);
  margin-bottom:7px; }
.verbatim { font-family:var(--font-mono); font-size:12px; white-space:pre-wrap; word-break:break-word;
  background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:12px 14px;
  color:var(--text-dim); }
.means { font-size:14px; line-height:1.55; color:var(--text); }

/* accept / reject columns */
.cols { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
@media (max-width:620px) { .cols { grid-template-columns:1fr; } }
.col { border:1px solid var(--border); border-radius:8px; padding:12px 14px; background:var(--surface); }
.col h3 { margin:0 0 9px; font-size:12px; text-transform:uppercase; letter-spacing:.06em; }
.col.accept h3 { color:var(--ok); }
.col.reject h3 { color:var(--bad); }
.col ul { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
.col li { display:flex; gap:8px; align-items:flex-start; font-size:12.5px; line-height:1.45; }
.col li .sign { font-family:var(--font-mono); flex:none; width:12px; text-align:center; }
.col li.pro .sign { color:var(--pro); }
.col li.con .sign { color:var(--con); }
.col .none { color:var(--text-ghost); font-style:italic; font-size:12px; }

/* rule check */
.rulecheck { display:flex; align-items:center; gap:9px; margin-top:14px; padding:9px 13px;
  border-radius:6px; font-size:12.5px; border:1px solid; }
.rulecheck.ok { color:var(--ok); border-color:var(--ok); background:var(--ok-bg); }
.rulecheck.warn { color:var(--warn); border-color:var(--warn); background:var(--warn-bg); }
.rulecheck.unknown { color:var(--text-dim); border-color:var(--border-2); background:var(--surface); }
.rulecheck .dot { width:8px; height:8px; border-radius:50%; flex:none; background:currentColor; }
.rulecheck b { font-family:var(--font-mono); }

/* discuss */
.thread { display:flex; flex-direction:column; gap:10px; max-height:340px; overflow-y:auto;
  border:1px solid var(--border); border-radius:8px; padding:12px; background:var(--surface); }
.thread.empty { color:var(--text-ghost); font-style:italic; align-items:center; }
.msg { max-width:82%; padding:8px 11px; border-radius:8px; font-size:12.5px; line-height:1.5;
  white-space:pre-wrap; word-break:break-word; }
.msg .who { display:block; font-family:var(--font-mono); font-size:10px; text-transform:uppercase;
  letter-spacing:.05em; color:var(--text-faint); margin-bottom:3px; }
.msg.user { align-self:flex-end; background:var(--surface-2); border:1px solid var(--border-2); }
.msg.assistant { align-self:flex-start; background:var(--bg); border:1px solid var(--border); }
.composer { display:flex; gap:8px; margin-top:10px; align-items:flex-end; }
textarea { flex:1; resize:both; min-height:54px; max-width:100%; background:var(--surface); color:var(--text);
  border:1px solid var(--border-2); border-radius:6px; padding:9px 11px; font:inherit; }
textarea:focus { outline:none; border-color:var(--accent); }
.btn { border:1px solid var(--border-2); background:var(--surface); color:var(--text);
  border-radius:6px; padding:8px 16px; cursor:pointer; white-space:nowrap; }
.btn:hover:not(:disabled) { border-color:var(--text-faint); }
.btn:disabled { opacity:.5; cursor:default; }
.btn.primary { border-color:var(--accent); color:var(--accent); }
.btn.accept { border-color:var(--ok); color:var(--ok); }
.btn.reject { border-color:var(--bad); color:var(--bad); }

/* synthesize / amended-draft */
.synth-row { display:flex; gap:10px; align-items:center; margin-top:12px; flex-wrap:wrap; }
.synth-hint { color:var(--text-faint); font-size:11.5px; font-style:italic; }
.amended { margin-top:14px; }
.amended .label .badge { font-family:var(--font-mono); font-size:10px; color:var(--accent);
  border:1px solid var(--accent); border-radius:999px; padding:1px 7px; margin-left:8px;
  text-transform:none; letter-spacing:0; }
#amended-draft { min-height:120px; }

/* decide zone */
.decide-note { color:var(--text-dim); font-size:12.5px; line-height:1.55; margin:0 0 14px; }
.decide-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
@media (max-width:620px) { .decide-grid { grid-template-columns:1fr; } }
.decide-card { border:1px solid var(--border); border-radius:8px; padding:14px; background:var(--surface);
  display:flex; flex-direction:column; gap:8px; }
.decide-card h4 { margin:0; font-size:12.5px; }
.decide-card .what { color:var(--text-faint); font-size:11.5px; line-height:1.45; flex:1; }
.decide-card.disabled { opacity:.55; }
.decide-reject { display:flex; gap:10px; align-items:center; margin-top:14px; padding-top:14px;
  border-top:1px solid var(--border); }
.handoff-path { font-family:var(--font-mono); font-size:12px; color:var(--ok); word-break:break-all; }
.decided-banner { display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:11px 14px;
  border:1px solid var(--ok); background:var(--ok-bg); color:var(--ok); border-radius:8px;
  font-size:12.5px; margin-bottom:14px; }
.decided-banner.reject { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.decided-banner.neutral { border-color:var(--border-2); background:var(--surface); color:var(--text-dim); }
.decided-banner a { color:inherit; text-decoration:underline; }
.eligibility { display:flex; gap:9px; align-items:flex-start; margin-top:12px; padding:10px 12px;
  border:1px solid var(--border-2); border-radius:7px; color:var(--text-dim); background:var(--surface); }
.eligibility.ready { border-color:var(--accent); color:var(--accent); }
.facts { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:8px; margin-top:14px; }
.fact { border:1px solid var(--border); border-radius:7px; padding:9px 11px; background:var(--surface); }
.fact .k { display:block; color:var(--text-faint); font-size:10px; text-transform:uppercase; letter-spacing:.07em; }
.fact .v { display:block; margin-top:3px; color:var(--text-dim); word-break:break-word; }
.model-notes { margin-top:16px; border:1px solid var(--border); border-radius:8px; background:var(--surface); }
.model-notes summary { cursor:pointer; padding:10px 12px; color:var(--text-dim); }
.model-notes .inside { padding:0 12px 12px; }
.empty-note { color:var(--text-faint); font-style:italic; }
.evidence-row { margin-top:7px; padding:8px 10px; border-left:2px solid var(--border-2);
  color:var(--text-dim); font:11px/1.5 var(--font-mono); white-space:pre-wrap; word-break:break-word; }

/* spinner */
.spin { width:14px; height:14px; border:2px solid var(--border-2); border-top-color:var(--accent);
  border-radius:50%; display:inline-block; animation:spin .7s linear infinite; vertical-align:middle; }
@keyframes spin { to { transform:rotate(360deg); } }
.thinking { display:flex; align-items:center; gap:8px; color:var(--text-faint); font-size:12px;
  align-self:flex-start; }

/* inline error / toast */
.err { color:var(--bad); font-size:12px; margin-top:8px; }
.toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); z-index:20;
  background:var(--surface); border:1px solid var(--border-2); border-radius:7px;
  padding:10px 16px; font-size:12.5px; box-shadow:0 6px 24px rgba(0,0,0,.35); max-width:80vw; }
.toast.bad { border-color:var(--bad); color:var(--bad); }
.toast.ok { border-color:var(--ok); color:var(--ok); }

/* modal (verdict note) */
.scrim { position:fixed; inset:0; background:rgba(0,0,0,.45); display:grid; place-items:center; z-index:30; }
.modal { background:var(--surface); border:1px solid var(--border-2); border-radius:10px;
  padding:18px 20px; width:min(560px,90vw); max-height:calc(100vh - 24px); overflow:auto; }
.modal h2 { margin:0 0 4px; font-size:15px; }
.modal p { margin:0 0 12px; color:var(--text-dim); font-size:12.5px; }
.modal .basis-line { color:var(--text-faint); font-size:11.5px; margin:0 0 12px; }
.modal .modal-actions { display:flex; justify-content:flex-end; gap:9px; margin-top:14px; }
@media (max-width:540px) {
  header { gap:8px; padding:0 10px; }
  .brand .sub, header .gerr { display:none; }
  nav.views a { padding-left:8px; padding-right:8px; }
  #list { border-right:none; border-bottom:1px solid var(--border); }
  #listbody { max-height:310px; overflow-y:auto; }
  #detail { padding:14px 10px 48px; }
}
</style>
</head>
<body>

<header>
  <div class="brand">brain<span class="sep">·</span><span class="sub">proposal review</span></div>
  <nav class="views">
    <a href="dashboard.html">Dashboard</a><a href="graph.html">Map</a><a href="activity.html">Skills &amp; Activity</a><a class="on" aria-current="page">Review</a>
  </nav>
  <div class="hspace"></div>
  <span class="gerr" id="gerr"></span>
</header>

<main>
  <aside id="list">
    <span class="sec">framework review records</span>
    <div class="list-tools">
      <label for="proposal-search">Search
        <input id="proposal-search" type="search" aria-label="Search review records" placeholder="id, title, target">
      </label>
      <button class="btn" type="button" id="refresh-review">Refresh records</button>
      <div class="catalog-counts" id="catalog-counts" role="status" aria-live="polite">loading counts…</div>
      <div class="catalog-counts">Held candidates are inspection-only; candidate graduation is closed.</div>
    </div>
    <div id="listbody"><div class="pitem muted">loading…</div></div>
  </aside>
  <section id="detail">
    <div class="placeholder" id="placeholder">select a proposal to review</div>
    <div id="detailbody" hidden></div>
  </section>
</main>

<script>
"use strict";
(function () {
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : typeof s === "object" ? JSON.stringify(s) : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;").replace(/'/g,"&#39;");

let proposals = [];        // all framework review records (ready/candidate/history)
let current = null;        // selected proposal_id
let currentDetail = null;  // canonical detail response for `current`, null while loading
let selectionEpoch = 0;    // invalidates every response/modal from an older selection
let busy = false;          // an advisory/verdict call for the current selection
let amendedDraft = null;   // latest synthesized/edited amended change for `current` (string|null)
let activeModal = null;
let listEpoch = 0;

/* ---------------- fetch helpers (same-origin only) ---------------- */
async function api(path, opts) {
  const controller = typeof AbortController === "function" ? new AbortController() : null;
  const timeoutMs = opts && opts.method === "POST" ? 185000 : 8000;
  let timer;
  try {
    const request = (async () => {
      const res = await fetch(path, {...opts, cache: "no-store", redirect: "error",
        ...(controller ? {signal: controller.signal} : {})});
      if (res.redirected) throw new Error("unexpected redirect");
      let data = null;
      try { data = await res.json(); } catch (_) { throw new Error("invalid JSON response"); }
      if (!res.ok) throw new Error(data && typeof data.error === "string" ? data.error : "HTTP " + res.status);
      if (!data || typeof data !== "object" || Array.isArray(data)) throw new Error("unsupported response shape");
      return data;
    })();
    const deadline = new Promise((_, reject) => {
      timer = setTimeout(() => {
        if (controller) controller.abort();
        reject(new Error("request timed out; outcome unknown, refresh records before retrying a decision"));
      }, timeoutMs);
    });
    return await Promise.race([request, deadline]);
  } finally { clearTimeout(timer); }
}

function toast(msg, kind) {
  const t = document.createElement("div");
  t.className = "toast" + (kind ? " " + kind : "");
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 4200);
}
function headerErr(msg) { $("gerr").textContent = msg || ""; }

/* request identity */
function validReview(record) {
  if (!record || typeof record !== "object" || Array.isArray(record) ||
      typeof record.proposal_id !== "string" || !/^P-\d+$/.test(record.proposal_id) ||
      record.scope !== "framework" || typeof record.eligible !== "boolean") return false;
  const lanes = {open: "ready", "human-review": "ready", draft: "candidate", closed: "history"};
  if (!Object.prototype.hasOwnProperty.call(lanes, record.lifecycle) || record.lane !== lanes[record.lifecycle]) return false;
  const eligible = record.lifecycle === "open" || record.lifecycle === "human-review";
  if (record.eligible !== eligible) return false;
  return record.lifecycle === "closed" ? ["accepted", "auto-accept", "rejected", "auto-reject"].includes(record.verdict)
    : record.verdict === (record.lifecycle === "human-review" ? "human-review" : "open");
}
function validateDetail(data, pid) {
  if (!data || typeof data !== "object" || Array.isArray(data) || !data.proposal ||
      typeof data.proposal !== "object" || Array.isArray(data.proposal) ||
      data.proposal.proposal_id !== pid || !validReview(data.review) || data.review.proposal_id !== pid)
    throw new Error("unsupported or inconsistent proposal detail / identity mismatch");
  if (data.review.eligible && (typeof data.proposal.change !== "string" || !data.proposal.change.trim() ||
      typeof data.proposal.target !== "string" || typeof data.proposal.target_type !== "string"))
    throw new Error("invalid decision basis; inspection cannot enable a decision");
  return data;
}
function captureSelection() {
  return current ? {pid: current, epoch: selectionEpoch} : null;
}
function selectionIsCurrent(request) {
  return !!request && request.pid === current && request.epoch === selectionEpoch;
}

/* ---------------- list ---------------- */
function verdictLabel(v) {
  if (!v || v === "open") return "open";
  if (v === "human-review") return "human-review";
  return v;
}
function renderList() {
  const host = $("listbody");
  const query = $("proposal-search").value.trim().toLowerCase();
  const filtered = proposals.filter(p => !query || [p.proposal_id, p.title, p.target, p.lifecycle,
    p.verdict].some(value => String(value || "").toLowerCase().includes(query)));
  const groups = [
    ["ready", "ready for review"],
    ["candidate", "held candidates"],
    ["history", "decision history"],
  ];
  if (!filtered.length) {
    host.innerHTML = '<div class="pitem muted">' +
      (proposals.length ? "no matching review records" : "no framework review records") + '</div>';
    return;
  }
  host.innerHTML = groups.map(([lane, label]) => {
    const rows = filtered.filter(p => p.lane === lane);
    if (!rows.length) return "";
    return '<section class="list-group" aria-label="' + esc(label) + '">' +
      '<div class="group-head"><span>' + esc(label) + '</span><b>' + rows.length + '</b></div>' +
      rows.map(p => {
        const v = verdictLabel(p.verdict);
        const vcls = v.indexOf("accept") === 0 ? "accept" : v.indexOf("reject") === 0 ? "reject" : "";
        return '<button type="button" class="pitem' + (p.proposal_id === current ? " on" : "") +
          '" data-pid="' + esc(p.proposal_id) + '" aria-pressed="' +
          (p.proposal_id === current ? "true" : "false") + '">' +
          '<span class="pid">' + esc(p.proposal_id) + '</span>' +
          '<span class="ptitle">' + esc(p.title || "(untitled)") + '</span>' +
          '<span class="pmeta"><span class="chip">' + esc(p.target_type || "?") + ':' +
          esc(p.target || "?") + '</span><span class="chip ' + esc(lane) + ' verdict ' + vcls + '">' +
          esc(p.lifecycle || v) + '</span></span></button>';
      }).join("") + '</section>';
  }).join("");
  Array.from(host.querySelectorAll(".pitem[data-pid]")).forEach(el =>
    el.addEventListener("click", () => selectProposal(el.getAttribute("data-pid"))));
}

async function loadList() {
  const request = ++listEpoch;
  $("refresh-review").disabled = true;
  $("catalog-counts").textContent = "Checking current records…";
  try {
    const d = await api("/api/proposals");
    if (request !== listEpoch) return false;
    if (!Array.isArray(d.records) || d.records.some(record => !validReview(record)) ||
        new Set(d.records.map(record => record.proposal_id)).size !== d.records.length)
      throw new Error("unsupported review catalog; counts and eligibility unavailable");
    proposals = d.records;
    const count = lane => proposals.filter(record => record.lane === lane).length;
    $("catalog-counts").textContent = count("ready") + " ready · " + count("candidate") + " held · " +
      count("history") + " history · checked " + new Date().toLocaleTimeString();
    headerErr("");
    renderList();
    return true;
  } catch (e) {
    if (request !== listEpoch) return false;
    proposals = [];
    currentDetail = null;
    if (activeModal) closeModal(activeModal);
    $("detailbody").hidden = true;
    $("placeholder").hidden = false;
    $("placeholder").textContent = "Records unavailable. Refresh records to check again; no decision is enabled.";
    $("catalog-counts").textContent = "Counts unavailable";
    $("listbody").innerHTML = '<div class="pitem" style="color:var(--bad)">load failed: ' + esc(e.message) + '</div>';
    headerErr("list error: " + e.message);
    return false;
  } finally { if (request === listEpoch) $("refresh-review").disabled = false; }
}
async function reloadRecords() {
  const wanted = current;
  selectionEpoch += 1;
  currentDetail = null;
  amendedDraft = null;
  busy = false;
  if (activeModal) closeModal(activeModal);
  $("detailbody").hidden = true;
  $("placeholder").hidden = false;
  $("placeholder").textContent = "Refreshing eligibility…";
  if (await loadList()) {
    if (wanted && proposals.some(record => record.proposal_id === wanted)) await selectProposal(wanted);
    else $("placeholder").textContent = "Select a record to inspect its current eligibility and evidence.";
  }
}

/* ---------------- detail ---------------- */
function bullets(arr, sign, cls) {
  if (!Array.isArray(arr)) return '<li class="none">Unavailable or unsupported stored notes</li>';
  if (!arr.length) return '<li class="none">None recorded</li>';
  return arr.map(x =>
    '<li class="' + cls + '"><span class="sign">' + sign + '</span><span>' + esc(x) + '</span></li>'
  ).join("");
}

function renderRuleCheck(rc) {
  const valid = rc && typeof rc === "object" && typeof rc.conflict === "boolean" &&
    rc.why !== "parse-fallback";
  if (!valid) {
    return '<div class="rulecheck unknown"><span class="dot"></span>rule note unavailable or unknown ' +
      '— stored model notes are non-authoritative</div>';
  }
  if (rc.conflict === true) {
    return '<div class="rulecheck warn"><span class="dot"></span>stored model note suggests a possible ' +
      'conflict with <b>' + esc(rc.rule || "a rule") + '</b>: ' + esc(rc.why || "reason unavailable") +
      ' · non-authoritative</div>';
  }
  return '<div class="rulecheck unknown"><span class="dot"></span>stored model note reports no conflict' +
    (rc.why ? ' — ' + esc(rc.why) : '') + ' · non-authoritative, not a rule-check pass</div>';
}

function renderThread(disc) {
  if (!Array.isArray(disc) || !disc.length) {
    return '<div class="thread empty" id="thread">no discussion yet — ask a question or raise a worry below</div>';
  }
  return '<div class="thread" id="thread">' + disc.filter(m => m && typeof m === "object" && !Array.isArray(m)).map(m =>
    '<div class="msg ' + (m.role === "user" ? "user" : "assistant") + '">' +
    '<span class="who">' + esc(m.role) + '</span>' + esc(m.content) + '</div>'
  ).join("") + '</div>';
}

function actorLabel(actor) {
  if (!actor || typeof actor !== "object") return "actor unavailable";
  const auth = actor.authentication ? actor.authentication : "authentication unavailable";
  return (actor.id || "unknown") + " · " + (actor.type || "unknown") + " · " + auth +
    (actor.cryptographically_authenticated === false ? " · not cryptographically authenticated" : "");
}

function recordedEvidence(rows) {
  if (!Array.isArray(rows) || !rows.length) {
    return '<div class="empty-note">No enactment or verification evidence is recorded for this proposal.</div>';
  }
  return '<details class="model-notes"><summary>Recorded evidence · source claims, not execution verification</summary>' +
    rows.map(row => '<div class="evidence-row">' +
      esc(row && typeof row === "object" ? row : "Unknown / unsupported evidence row") + '</div>').join("") + '</details>';
}

function modelNotes(card) {
  if (!card || typeof card !== "object") {
    return '<div class="empty-note">No stored model notes. Opening a record never generates model notes.</div>';
  }
  return '<details class="model-notes"><summary>Stored model notes · non-authoritative · ' +
    esc(card.model || "model unavailable") + ' · ' + esc(card.generated_at || "time unavailable") + '</summary>' +
    '<div class="inside"><div class="block"><div class="label">model interpretation</div>' +
    '<div class="means">' + esc(card.means || "unavailable") + '</div></div>' +
    '<div class="block"><div class="label">model-suggested trade-offs</div><div class="cols">' +
    '<div class="col accept"><h3>accept notes</h3><ul>' +
    bullets(card.pros_accept, "+", "pro") + bullets(card.cons_accept, "−", "con") + '</ul></div>' +
    '<div class="col reject"><h3>reject notes</h3><ul>' +
    bullets(card.pros_reject, "+", "pro") + bullets(card.cons_reject, "−", "con") + '</ul></div>' +
    '</div>' + renderRuleCheck(card.rule_check) + '</div></div></details>';
}

function renderDetail(d) {
  validateDetail(d, current);
  const p = d.proposal || {};
  const c = d.card || null;
  const disc = d.discussion || [];
  const review = d.review || {};
  currentDetail = d;
  amendedDraft = (d.amended_draft != null) ? String(d.amended_draft) : null;
  const eligible = review.eligible === true;
  const decision = review.decision || null;
  const decisionFacts = decision
    ? '<div class="facts"><div class="fact"><span class="k">governing verdict</span><span class="v">' +
      esc(decision.verdict || review.verdict || "unknown") + '</span></div>' +
      '<div class="fact"><span class="k">recorded actor (not authenticated here)</span><span class="v">' +
      esc(actorLabel(decision.actor)) + '</span></div>' +
      '<div class="fact"><span class="k">recorded at</span><span class="v mono">' +
      esc(decision.timestamp || "unavailable") + '</span></div>' +
      '<div class="fact"><span class="k">canonical source</span><span class="v mono">' +
      esc(decision.source || "unavailable") + '</span></div></div>'
    : '<div class="empty-note">No governing verdict has been recorded.</div>';
  const html =
    '<div class="dhead">' +
      '<h1>' + esc(p.title || "(untitled)") + '</h1>' +
      '<span class="chip">' + esc(p.target_type || "?") + ':' + esc(p.target || "?") + '</span>' +
      '<span class="chip mono">' + esc(p.proposal_id || current) + '</span>' +
      '<span class="chip ' + esc(review.lane || "") + '">' + esc(review.lifecycle || "unknown") + '</span>' +
    '</div>' +
    '<div class="eligibility' + (eligible ? " ready" : "") + '"><b>' +
      esc(eligible ? "Decision eligible" : "Inspection only") + '</b><span>' +
      esc(review.eligibility_reason || "eligibility unavailable") + '</span></div>' +

    /* ----- ZONE 1: canonical record ----- */
    '<section class="zone">' +
      '<div class="zhead"><span class="znum">1</span>' +
        '<span class="ztitle">Canonical record</span>' +
        '<span class="zsub">proposal, basis, lifecycle and recorded evidence</span></div>' +
      '<div class="zbody">' +
        '<div class="block"><div class="label">proposed change (verbatim)</div>' +
          '<div class="verbatim">' + esc(p.change || "(no change text)") + '</div></div>' +
        '<div class="block"><div class="label">filing basis / reasoning</div>' +
          '<div class="verbatim">' + esc(p.reasoning || "(no filing reasoning)") + '</div></div>' +
        '<div class="block"><div class="label">governing decision</div>' + decisionFacts + '</div>' +
        '<div class="block"><div class="label">recorded lifecycle evidence</div>' +
          recordedEvidence(review.evidence) + '</div>' +
        '<div class="block"><div class="label">optional advisory context</div>' + modelNotes(c) + '</div>' +
      '</div>' +
    '</section>' +

    /* ----- ZONE 2: optional stored/refinement context ----- */
    '<section class="zone">' +
      '<div class="zhead"><span class="znum">2</span>' +
        '<span class="ztitle">Review notes</span>' +
        '<span class="zsub">optional and non-authoritative</span></div>' +
      '<div class="zbody">' +
        '<div class="block"><div class="label">conversation</div>' +
          renderThread(disc) +
          (eligible ? '<div class="composer">' +
            '<textarea id="msg" placeholder="Ask a question or raise a worry — e.g. None of these look clean… / What if we…"></textarea>' +
            '<button class="btn primary" id="send">Ask Gemma</button>' +
          '</div><div class="err" id="discuss-err"></div>' :
          '<div class="empty-note">Advisory discussion is unavailable for this ineligible record.</div>') +
        '</div>' +
        (eligible ? '<div class="block">' +
          '<div class="synth-row">' +
            '<button class="btn" id="synthesize">Draft updated proposal from this conversation</button>' +
            '<span class="synth-hint">turns the discussion into a crisp amended proposal you can edit</span>' +
          '</div>' +
          '<div class="amended" id="amended-wrap"' + (amendedDraft != null ? "" : " hidden") + '>' +
            '<div class="label">amended proposal (final form)<span class="badge">editable</span></div>' +
            '<textarea id="amended-draft" placeholder="(no amended draft yet — draft one above)">' +
              esc(amendedDraft != null ? amendedDraft : "") + '</textarea>' +
          '</div>' +
          '<div class="err" id="synth-err"></div>' +
        '</div>' : (amendedDraft != null ? '<div class="block"><div class="label">stored amended draft · non-authoritative</div>' +
          '<div class="verbatim">' + esc(amendedDraft) + '</div></div>' : '')) +
      '</div>' +
    '</section>' +

    /* ----- ZONE 3: Decide ----- */
    '<section class="zone">' +
      '<div class="zhead"><span class="znum">3</span>' +
        '<span class="ztitle">Decide</span>' +
        '<span class="zsub">' + (eligible ? "records the verdict and writes the handoff" : "inspection only") + '</span></div>' +
      '<div class="zbody" id="decide-body"></div>' +
    '</section>';

  const body = $("detailbody");
  body.innerHTML = html;
  body.hidden = false;
  $("placeholder").hidden = true;

  if (eligible) {
    $("send").addEventListener("click", sendMessage);
    $("msg").addEventListener("keydown", e => {
      if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); sendMessage(); }
    });
    $("synthesize").addEventListener("click", synthesize);
    $("amended-draft").addEventListener("input", () => {
      amendedDraft = $("amended-draft").value;
      syncAcceptAmended();
    });
  }
  renderDecide();
  scrollThread();
}

/* Decide zone — re-rendered after a decision so the buttons reflect state. */
function renderDecide() {
  const host = $("decide-body");
  if (!host) return;
  const review = currentDetail && currentDetail.review;
  if (!review || review.eligible !== true) {
    const loading = !review;
    const v = review && review.lifecycle === "draft" ? "Held candidate" : review && review.verdict ? String(review.verdict) : "decision unavailable";
    const reject = v.indexOf("reject") >= 0;
    const accepted = review && ["accepted", "auto-accept"].includes(review.verdict);
    host.innerHTML =
      '<div class="decided-banner' + (reject ? " reject" : accepted ? "" : " neutral") + '" id="decided-banner">' +
        '<b>' + esc(loading ? "Loading eligibility" : v) + '</b><span>' +
        esc(loading ? "Decision controls are unavailable until canonical detail loads." :
          (review.eligibility_reason || "Decision controls are unavailable.")) + '</span>' +
      '</div>' +
      '<p class="decide-note">No decision action is available in this lifecycle state.</p>';
    return;
  }
  host.innerHTML =
    '<p class="decide-note">Accepting records the decision <b>and</b> writes the implementation ' +
    'handoff for the dev session — there is no separate step.</p>' +
    '<div class="decide-grid">' +
      '<div class="decide-card" id="card-original">' +
        '<h4>Accept original proposal</h4>' +
        '<div class="what">Records the <b>original</b> description above as the governed change, and writes the handoff from it.</div>' +
        '<button class="btn accept" id="accept-original">Accept original</button>' +
      '</div>' +
      '<div class="decide-card" id="card-amended">' +
        '<h4>Accept amended draft</h4>' +
        '<div class="what">Records the <b>edited amended draft</b> (Zone 2) as the governed change, and writes the handoff from it. ' +
        'Draft one first to enable this.</div>' +
        '<button class="btn accept" id="accept-amended">Accept amended</button>' +
      '</div>' +
    '</div>' +
    '<div class="decide-reject">' +
      '<button class="btn reject" id="reject">Reject</button>' +
      '<span class="synth-hint">rejecting records a verdict only — no handoff is written</span>' +
      '<span class="hspace"></span>' +
      '<span class="handoff-path" id="handoff-path"></span>' +
    '</div>';
  $("accept-original").addEventListener("click", () => promptVerdict("accept", "original"));
  $("accept-amended").addEventListener("click", () => promptVerdict("accept", "amended"));
  $("reject").addEventListener("click", () => promptVerdict("reject", "original"));
  syncAcceptAmended();
}

/* "Accept amended" is enabled only once a non-empty amended draft exists. */
function syncAcceptAmended() {
  const btn = $("accept-amended");
  const card = $("card-amended");
  if (!btn) return;
  const has = !!(currentDetail && currentDetail.review && currentDetail.review.eligible === true &&
    amendedDraft != null && amendedDraft.trim() !== "");
  btn.disabled = !has;
  if (card) card.classList.toggle("disabled", !has);
}

function currentRow() { return proposals.find(p => p.proposal_id === current) || null; }
function isDecided(row) {
  if (!row) return false;
  const v = row.verdict;
  return v && v !== "open" && v !== "human-review";
}

function scrollThread() {
  const t = $("thread");
  if (t) t.scrollTop = t.scrollHeight;
}

async function selectProposal(pid) {
  const record = proposals.find(row => row.proposal_id === pid);
  if (!record) {
    headerErr("record is not in the framework review catalog");
    return;
  }
  if (activeModal) closeModal(activeModal);
  selectionEpoch += 1;
  current = pid;
  currentDetail = null;
  amendedDraft = null;
  busy = false;
  setBusy(false);
  const request = captureSelection();
  renderList();
  const body = $("detailbody");
  body.hidden = true;
  $("placeholder").hidden = false;
  $("placeholder").innerHTML = '<span class="spin"></span>&nbsp; loading ' + esc(pid) +
    ' canonical record… no model is invoked';
  headerErr("");
  try {
    const d = await api("/api/proposal/" + encodeURIComponent(request.pid));
    if (!selectionIsCurrent(request)) return;
    renderDetail(d);
  } catch (e) {
    if (selectionIsCurrent(request)) currentDetail = null;
    if (!selectionIsCurrent(request)) return;
    $("placeholder").innerHTML = '<span style="color:var(--bad)">failed to load ' +
      esc(pid) + ': ' + esc(e.message) + '</span>';
    headerErr("detail error: " + e.message);
  }
}

/* ---------------- discuss (ask Gemma) ---------------- */
async function sendMessage() {
  if (busy || !currentDetail || !currentDetail.review || currentDetail.review.eligible !== true) return;
  const request = captureSelection();
  const ta = $("msg");
  const msg = ta.value.trim();
  const errEl = $("discuss-err");
  errEl.textContent = "";
  if (!msg) { errEl.textContent = "type a message first"; return; }

  // optimistic: echo the user turn + a thinking row
  const t = $("thread");
  if (t && t.classList.contains("empty")) { t.classList.remove("empty"); t.innerHTML = ""; }
  if (t) {
    t.insertAdjacentHTML("beforeend",
      '<div class="msg user" id="optimistic-user"><span class="who">user</span>' + esc(msg) + '</div>' +
      '<div class="thinking" id="thinking"><span class="spin"></span>Gemma is thinking…</div>');
    scrollThread();
  }

  setBusy(true, "#send");
  ta.value = "";
  try {
    const d = await api("/api/proposal/" + encodeURIComponent(request.pid) + "/discuss",
      { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: msg }) });
    if (!selectionIsCurrent(request)) return;
    // re-render the canonical thread returned by the server
    const fresh = renderThread(d.discussion || []);
    const wrap = document.createElement("div");
    wrap.innerHTML = fresh;
    const newThread = wrap.firstElementChild;
    const old = $("thread");
    if (old) old.replaceWith(newThread);
    scrollThread();
  } catch (e) {
    if (!selectionIsCurrent(request)) return;
    // nothing was persisted server-side — drop both optimistic rows so the
    // thread reflects only persisted turns (the message is restored below).
    const th = $("thinking");
    if (th) th.remove();
    const ou = $("optimistic-user");
    if (ou) ou.remove();
    errEl.textContent = "discuss failed: " + e.message;
    ta.value = msg; // restore so the human doesn't lose it
    toast("discuss failed: " + e.message, "bad");
  } finally {
    if (selectionIsCurrent(request)) setBusy(false, "#send");
  }
}

/* ---------------- synthesize amended draft ---------------- */
async function synthesize() {
  if (busy || !currentDetail || !currentDetail.review || currentDetail.review.eligible !== true) return;
  const request = captureSelection();
  const btn = $("synthesize"), errEl = $("synth-err");
  errEl.textContent = "";
  const orig = btn.textContent;
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>&nbsp;drafting…';
  setBusy(true, "#synthesize");
  try {
    const d = await api("/api/proposal/" + encodeURIComponent(request.pid) + "/synthesize",
      { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
    if (!selectionIsCurrent(request)) return;
    amendedDraft = (d.amended_change != null) ? String(d.amended_change) : "";
    $("amended-wrap").hidden = false;
    $("amended-draft").value = amendedDraft;
    syncAcceptAmended();
    toast("amended draft ready — edit it, then Accept amended", "ok");
  } catch (e) {
    if (!selectionIsCurrent(request)) return;
    errEl.textContent = "draft failed: " + e.message;
    toast("draft failed: " + e.message, "bad");
  } finally {
    if (selectionIsCurrent(request)) {
      btn.disabled = false;
      btn.textContent = orig;
      setBusy(false, "#synthesize");
    }
  }
}

/* ---------------- verdict ---------------- */
function promptVerdict(verdict, basis) {
  if (busy) return;
  if (!currentDetail || !currentDetail.review || currentDetail.review.eligible !== true) {
    toast("decision unavailable until canonical eligibility is loaded", "bad");
    return;
  }
  if (verdict === "accept" && basis === "amended") {
    if (amendedDraft == null || amendedDraft.trim() === "") {
      toast("draft an amended proposal first", "bad");
      return;
    }
  }
  openModal(verdict, basis);
}

function openModal(verdict, basis) {
  const selection = captureSelection();
  if (!selectionIsCurrent(selection) || !currentDetail || currentDetail.review.eligible !== true) return;
  const isAccept = verdict === "accept";
  const title = isAccept
    ? (basis === "amended" ? "Accept amended draft" : "Accept original proposal")
    : "Reject";
  let basisLine = "";
  if (isAccept) {
    basisLine = basis === "amended"
      ? "Records the edited amended draft as the governed change, then writes the handoff from it."
      : "Records the original proposal as the governed change, then writes the handoff from it.";
  }
  // The note is the decision RATIONALE (recorded as verdict_reasoning) — NOT the
  // proposal text, which is already captured. Optional for accept (the human is
  // the authority); required for reject (a rejection owes a reason). Pre-filled
  // with a sensible default so accept is one click, never a copy-paste.
  const defaultNote = isAccept
    ? (basis === "amended"
        ? "Accepted the amended draft from the review discussion."
        : "Accepted as filed.")
    : "";
  const noteHelp = isAccept
    ? "Optional — a one-line reason for the record (verdict_reasoning). "
      + "This is NOT the proposal" + (basis === "amended" ? " — the amended draft" : "")
      + " is already captured; edit or clear this as you like."
    : "Required — why are you rejecting this? Recorded with the verdict.";
  const notePlaceholder = isAccept
    ? "Reason for accepting (optional)"
    : "Why reject? (required)";
  const proposal = currentDetail.proposal || {};
  const governedChange = basis === "amended" ? amendedDraft : proposal.change;
  const context = {
    selection: selection,
    pid: selection.pid,
    proposal: proposal,
    amendedChange: basis === "amended" ? amendedDraft : null,
  };
  const scrim = document.createElement("div");
  scrim.className = "scrim";
  scrim._reviewContext = context;
  scrim._returnFocus = document.activeElement;
  scrim.innerHTML =
    '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="verdict-title">' +
      '<h2 id="verdict-title">' + esc(title) + ' ' + esc(context.pid) + '</h2>' +
      '<p>' + esc(noteHelp) + '</p>' +
      (basisLine ? '<p class="basis-line">' + esc(basisLine) + '</p>' : '') +
      '<div class="fact"><span class="k">target</span><span class="v mono">' +
        esc((proposal.target_type || "?") + ":" + (proposal.target || "?")) + '</span></div>' +
      '<div class="fact"><span class="k">decision basis</span><span class="v">' + esc(basis) + '</span></div>' +
      '<div class="block"><div class="label">exact governed change</div><div class="verbatim">' +
        esc(governedChange || "(missing proposal text)") + '</div></div>' +
      '<div class="block"><div class="label">filing basis / reasoning</div><div class="verbatim">' +
        esc(proposal.reasoning || "(not supplied)") + '</div></div>' +
      '<label for="actor-id">Acting as <b>(required)</b></label>' +
      '<select id="actor-id">' +
        '<option value="">Select Derrick or Oracle</option>' +
        '<option value="derrick">Derrick — human</option>' +
        '<option value="oracle">Oracle — agent</option>' +
      '</select>' +
      '<label><input type="checkbox" id="actor-confirm"> I confirm this is an identity assertion only; it is not cryptographically authenticated.</label>' +
      '<textarea id="note" placeholder="' + esc(notePlaceholder) + '">' + esc(defaultNote) + '</textarea>' +
      '<div class="err" id="note-err"></div>' +
      '<div class="modal-actions">' +
        '<button class="btn" id="cancel">Cancel</button>' +
        '<button class="btn ' + esc(verdict) + '" id="confirm">' + esc(isAccept ? "Accept" : "Reject") + '</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(scrim);
  activeModal = scrim;
  const note = scrim.querySelector("#note");
  const actor = scrim.querySelector("#actor-id");
  const actorConfirm = scrim.querySelector("#actor-confirm");
  actor.focus();
  const close = () => closeModal(scrim);
  scrim.addEventListener("click", e => { if (e.target === scrim) close(); });
  scrim.querySelector("#cancel").addEventListener("click", close);
  scrim.querySelector("#confirm").addEventListener("click", () => {
    const errEl = scrim.querySelector("#note-err");
    if (!actor.value || !actorConfirm.checked) {
      errEl.textContent = "select Derrick or Oracle and confirm the asserted identity";
      return;
    }
    submitVerdict(verdict, basis, note.value.trim(), actor.value, scrim);
  });
  scrim.addEventListener("keydown", e => {
    if (e.key === "Escape") { e.preventDefault(); close(); return; }
    if (e.key !== "Tab") return;
    const focusable = Array.from(scrim.querySelectorAll("button, select, textarea, input"))
      .filter(el => !el.disabled);
    if (!focusable.length) return;
    const first = focusable[0], last = focusable[focusable.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });
}

function closeModal(scrim) {
  if (!scrim) return;
  const returnFocus = scrim._returnFocus;
  scrim.remove();
  if (activeModal === scrim) activeModal = null;
  if (returnFocus && typeof returnFocus.focus === "function" && returnFocus.isConnected !== false) {
    returnFocus.focus();
  }
}

async function submitVerdict(verdict, basis, note, actorId, scrim) {
  const errEl = scrim.querySelector("#note-err");
  errEl.textContent = "";
  const context = scrim._reviewContext;
  if (!context || !selectionIsCurrent(context.selection) || !currentDetail ||
      !currentDetail.review || currentDetail.review.eligible !== true) {
    errEl.textContent = "selection changed; this decision is no longer available";
    return;
  }
  if (!note && verdict !== "accept") { errEl.textContent = "a reason is required to reject"; return; }
  // basis only meaningful on accept; reject always records the original verdict.
  const useBasis = (verdict === "accept") ? basis : "original";
  if (actorId !== "derrick" && actorId !== "oracle") {
    errEl.textContent = "select a valid actor";
    return;
  }
  const confirm = scrim.querySelector("#confirm");
  confirm.disabled = true;
  confirm.innerHTML = '<span class="spin"></span>';
  setBusy(true);
  const payload = { verdict: verdict, note: note, basis: useBasis, actor_id: actorId };
  if (verdict === "accept" && useBasis === "amended") {
    payload.amended_change = (context.amendedChange != null) ? context.amendedChange : "";
  }
  try {
    const d = await api("/api/proposal/" + encodeURIComponent(context.pid) + "/verdict",
      { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload) });
    if (!selectionIsCurrent(context.selection)) return;
    if (!d.ok) throw new Error(d.error || ("CLI exit " + (d.exit_code != null ? d.exit_code : "?")));
    closeModal(scrim);
    const decided = context.pid;
    const hp = d.handoff_path || "";
    toast(verdict + "ed " + decided + (d.recorded ? " · recorded" : "") +
      (hp ? " · handoff written" : ""), "ok");
    // refresh the canonical list (decided proposals usually drop out of /api/proposals)
    await loadList();
    if (!selectionIsCurrent(context.selection)) return;
    const stillListed = proposals.find(p => p.proposal_id === decided);
    if (stillListed) {
      // The additive catalog retains history, so re-show the canonical outcome.
      selectProposal(decided);
    } else {
      current = null;
      $("detailbody").hidden = true;
      $("placeholder").hidden = false;
      $("placeholder").innerHTML = esc(decided) + " " + esc(verdict) + "ed — select another proposal" +
        (hp ? '<br><span class="handoff-path">→ ' + esc(hp) + '</span>' : "");
    }
    if (hp) toast("handoff: " + hp, "ok");
  } catch (e) {
    if (!selectionIsCurrent(context.selection)) return;
    errEl.textContent = "verdict failed: " + e.message;
    confirm.disabled = false;
    confirm.textContent = (verdict === "accept") ? "Accept" : "Reject";
    toast("verdict failed: " + e.message, "bad");
  } finally {
    if (selectionIsCurrent(context.selection)) setBusy(false);
  }
}

/* ---------------- busy lock ---------------- */
function setBusy(state, sel) {
  busy = state;
  // disable the discuss/synthesize buttons during any in-flight op; only repaint
  // the button that owns the current op as a spinner (each shows its own).
  const send = $("send");
  if (send) {
    send.disabled = state;
    if (sel === "#send") send.innerHTML = state ? '<span class="spin"></span>' : "Ask Gemma";
  }
  const synth = $("synthesize");
  if (synth && sel !== "#synthesize") synth.disabled = state;
}

/* ---------------- init ---------------- */
$("proposal-search").addEventListener("input", renderList);
$("refresh-review").addEventListener("click", reloadRecords);
loadList().then(loaded => {
  if (!loaded) return;
  // honor a dashboard deep-link (proposal_review.html?id=P-NNN); guard the id
  // so a bogus param can never reach the API.
  const want = new URLSearchParams(location.search).get("id");
  if (want && /^P-\d+$/.test(want)) {
    if (proposals.some(row => row.proposal_id === want)) selectProposal(want);
    else {
      $("placeholder").textContent = want + " is not in the framework review catalog";
      headerErr("deep link unavailable");
    }
  }
});
})();
</script>
